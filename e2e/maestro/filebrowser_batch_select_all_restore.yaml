# E2E Test: FileBrowser Select All and Deselect
# Tests Select All button selects entire visible directory, Deselect clears
# Repository: /sdcard/testrepo
# Password: test123
#
# Navigation: ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
---
# Clear app state and start fresh
- clearState
- launchApp

# Connect to repository
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 10000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    text: "Repository Path"
- inputText: "/sdcard/testrepo"

- tapOn:
    text: "Repository Password"
- inputText: "test123"

- hideKeyboard
- tapOn: "Connect"

# SnapshotsScreen → SourceSnapshotsScreen
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 15000
- tapOn:
    text: ".*76 files.*"

# SourceSnapshotsScreen → FileBrowserScreen
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- tapOn:
    text: ".*76.*files.*"

# FileBrowserScreen root: wait for file list
- extendedWaitUntil:
    visible: "/"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: ".*level1.*"
    timeout: 10000

# Long-press "hidden_dir" (known root entry) to enter selection mode
- longPressOn:
    text: ".*hidden_dir.*"

# Wait for "1 selected" toolbar (WebView DOM update can be slow)
- extendedWaitUntil:
    visible: "1 selected"
    timeout: 10000

- assertVisible: "1 selected"
- assertVisible: "Select All"

# Tap Select All
- tapOn: "Select All"

# Verify "Deselect" appears (meaning all items selected, same button toggles)
- extendedWaitUntil:
    visible: "Deselect"
    timeout: 3000

- assertVisible: "Deselect"

# Verify selected count is greater than 1
- assertVisible:
    text: ".* selected"

# Tap Deselect to clear all
- tapOn: "Deselect"

# Wait for "Select All" to reappear (Deselect toggled back)
# and count should be 0 or the toolbar should update
- extendedWaitUntil:
    visible: "Select All"
    timeout: 3000

# Tap X to exit selection mode
- tapOn:
    text: ".*"
    optional: true

# Verify normal file list icons are restored (no checkboxes)
# and selection toolbar is gone
- extendedWaitUntil:
    notVisible: "selected"
    timeout: 3000
