# E2E Test: Connect to v1_test_repo (V1 index format) and verify connection
# Repository: /sdcard/v1repo (V1 format repo)
# Password: test123
# Expected: Successfully connect and see snapshot list
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Wait for home screen and navigate to Connect
- assertVisible: "Connect to Repository"
- tapOn: "Connect to Repository"

# Wait for Connect Repository screen
- assertVisible: "Connect Repository"

# Enter path
- tapOn:
    text: "Repository Path"
- inputText: "/sdcard/v1repo"

# Enter password
- tapOn:
    text: "Repository Password"
- inputText: "test123"

# Hide keyboard and tap Connect button
- hideKeyboard
- tapOn: "Connect"

# Wait for connection and verify success
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 15000
