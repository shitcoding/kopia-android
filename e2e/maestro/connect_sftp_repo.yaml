# E2E Test: Connect to SFTP Repository
# Verifies the complete connection flow for an SFTP storage backend.
#
# Prerequisites:
#   - Docker storage backends running (scripts/start_storage_backends.sh)
#   - Repositories seeded (scripts/seed_storage_backends.sh)
#
# Repository: SFTP at 10.0.2.2:2222 path /upload/kopia-e2e
# Password: test123
# Expected: Connect successfully and see snapshot list
#
# UI is rendered in WebView (React app).
# NOTE: hideKeyboard is called between fields to prevent the keyboard from
# obscuring lower fields and causing mistyped input. Fields with default
# values (Port) use longPress+erase for reliability.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Wait for welcome screen and navigate to Connect
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 15000

- tapOn: "Connect to Repository"

# Wait for Connect Repository screen
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# Switch to SFTP tab
- tapOn:
    id: "storage-tab-sftp"

# Fill SFTP fields -- hide keyboard between each to keep all fields visible
- tapOn:
    id: "sftp-host-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "10.0.2.2"
- hideKeyboard

# Port field defaults to "22" -- clear default and enter 2222
- tapOn:
    id: "sftp-port-input"
- waitForAnimationToEnd
- eraseText: 10
- eraseText: 1
- inputText: "2222"
- hideKeyboard

- tapOn:
    id: "sftp-username-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "sftp-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/upload/kopia-e2e"
- hideKeyboard

- tapOn:
    id: "sftp-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia123"
- hideKeyboard

# Scroll down to ensure repository password field is visible
- scroll

# Fill repository password
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard

# Tap Connect button
- tapOn:
    id: "connect-button"

# Wait for connection and verify success - should see Snapshots screen
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 60000
