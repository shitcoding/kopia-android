# E2E Test: SFTP Connection Error Handling
# Verifies proper error handling for invalid SFTP credentials and missing fields.
#
# Prerequisites:
#   - Docker storage backends running (scripts/start_storage_backends.sh)
#   - Repositories seeded (scripts/seed_storage_backends.sh)
#
# Tests:
#   1. Missing host -> validation error
#   2. Missing username -> validation error
#   3. Wrong SFTP password -> SSH auth error
#   4. Wrong repository password -> repo auth error
#   5. Successful connection after errors (recovery test)
#
# UI is rendered in WebView (React app).
# NOTE: eraseText does not work reliably in WebView inputs. We navigate back
# and re-enter the Connect screen to get fresh empty fields between tests.
# hideKeyboard is called between fields to prevent the keyboard from
# obscuring lower fields and causing mistyped input.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Navigate to connect screen
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 15000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# Switch to SFTP tab
- tapOn:
    id: "storage-tab-sftp"

# ========================================
# Test 1: Missing host validation
# ========================================
# Fill everything except host
- tapOn:
    id: "sftp-port-input"
- longPressOn:
    id: "sftp-port-input"
- eraseText: 10
- waitForAnimationToEnd
- inputText: "2222"
- hideKeyboard

- tapOn:
    id: "sftp-username-input"
- waitForAnimationToEnd
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "sftp-path-input"
- waitForAnimationToEnd
- inputText: "/upload/kopia-e2e"
- hideKeyboard

- tapOn:
    id: "sftp-password-input"
- waitForAnimationToEnd
- inputText: "kopia123"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show validation error about host
- extendedWaitUntil:
    visible:
      text: ".*host.*required.*|.*Host.*required.*"
    timeout: 5000

# ========================================
# Test 2: Missing username validation
# ========================================
# Navigate back and re-enter for fresh form
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-sftp"

# Fill everything except username
- tapOn:
    id: "sftp-host-input"
- waitForAnimationToEnd
- inputText: "10.0.2.2"
- hideKeyboard

- tapOn:
    id: "sftp-port-input"
- longPressOn:
    id: "sftp-port-input"
- eraseText: 10
- waitForAnimationToEnd
- inputText: "2222"
- hideKeyboard

# Skip Username intentionally

- tapOn:
    id: "sftp-path-input"
- waitForAnimationToEnd
- inputText: "/upload/kopia-e2e"
- hideKeyboard

- tapOn:
    id: "sftp-password-input"
- waitForAnimationToEnd
- inputText: "kopia123"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show validation error about username
- extendedWaitUntil:
    visible:
      text: ".*username.*required.*|.*Username.*required.*"
    timeout: 5000

# ========================================
# Test 3: Wrong SFTP password -> SSH auth error
# ========================================
# Navigate back and re-enter for fresh form
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-sftp"

# Fill with wrong SFTP password
- tapOn:
    id: "sftp-host-input"
- waitForAnimationToEnd
- inputText: "10.0.2.2"
- hideKeyboard

- tapOn:
    id: "sftp-port-input"
- longPressOn:
    id: "sftp-port-input"
- eraseText: 10
- waitForAnimationToEnd
- inputText: "2222"
- hideKeyboard

- tapOn:
    id: "sftp-username-input"
- waitForAnimationToEnd
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "sftp-path-input"
- waitForAnimationToEnd
- inputText: "/upload/kopia-e2e"
- hideKeyboard

- tapOn:
    id: "sftp-password-input"
- waitForAnimationToEnd
- inputText: "wrongpassword"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show SSH/auth error
- extendedWaitUntil:
    visible:
      text: ".*auth.*|.*denied.*|.*failed.*|.*error.*|.*ssh.*|.*handshake.*"
    timeout: 15000

# ========================================
# Test 4: Wrong repository password -> repo auth error
# ========================================
# Navigate back and re-enter for fresh form
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-sftp"

# Fill with correct SFTP credentials but wrong repo password
- tapOn:
    id: "sftp-host-input"
- waitForAnimationToEnd
- inputText: "10.0.2.2"
- hideKeyboard

- tapOn:
    id: "sftp-port-input"
- longPressOn:
    id: "sftp-port-input"
- eraseText: 10
- waitForAnimationToEnd
- inputText: "2222"
- hideKeyboard

- tapOn:
    id: "sftp-username-input"
- waitForAnimationToEnd
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "sftp-path-input"
- waitForAnimationToEnd
- inputText: "/upload/kopia-e2e"
- hideKeyboard

- tapOn:
    id: "sftp-password-input"
- waitForAnimationToEnd
- inputText: "kopia123"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- inputText: "wrongpassword"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show repo auth error
- extendedWaitUntil:
    visible:
      text: ".*invalid.*|.*incorrect.*|.*failed.*|.*error.*|.*wrong.*|.*password.*"
    timeout: 15000

# ========================================
# Test 5: Successful connection after errors (recovery)
# ========================================
# Navigate back and re-enter for fresh form
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-sftp"

# Fill with correct credentials
- tapOn:
    id: "sftp-host-input"
- waitForAnimationToEnd
- inputText: "10.0.2.2"
- hideKeyboard

- tapOn:
    id: "sftp-port-input"
- longPressOn:
    id: "sftp-port-input"
- eraseText: 10
- waitForAnimationToEnd
- inputText: "2222"
- hideKeyboard

- tapOn:
    id: "sftp-username-input"
- waitForAnimationToEnd
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "sftp-path-input"
- waitForAnimationToEnd
- inputText: "/upload/kopia-e2e"
- hideKeyboard

- tapOn:
    id: "sftp-password-input"
- waitForAnimationToEnd
- inputText: "kopia123"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should navigate to Snapshots screen after successful connection
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 30000
