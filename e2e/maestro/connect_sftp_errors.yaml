- waitForAnimationToEnd
- eraseText: 10
- eraseText: 1
- inputText: "2222"
- hideKeyboard

- tapOn:
    id: "sftp-username-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "sftp-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/upload/kopia-e2e"
