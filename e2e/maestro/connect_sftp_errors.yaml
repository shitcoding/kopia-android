# E2E Test: SFTP Connection Error Handling
# Verifies proper error handling for invalid SFTP credentials and missing fields.
#
# Prerequisites:
#   - Docker storage backends running (scripts/start_storage_backends.sh)
#   - Repositories seeded (scripts/seed_storage_backends.sh)
#
# Tests:
#   1. Missing host -> validation error
#   2. Missing username -> validation error
#   3. Wrong SFTP password -> SSH auth error
#   4. Wrong repository password -> repo auth error
#   5. Successful connection after errors (recovery test)
#
# UI is rendered in WebView (React app).
# NOTE: eraseText does not work reliably in WebView inputs. We navigate back
# and re-enter the Connect screen to get fresh empty fields between tests.
# hideKeyboard is called between fields to prevent the keyboard from
# obscuring lower fields and causing mistyped input.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Navigate to connect screen
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 15000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# Switch to SFTP tab
- tapOn:
    id: "storage-tab-sftp"

# ========================================
# Test 1: Missing host validation
# ========================================
# Fill everything except host
- tapOn:
    id: "sftp-port-input"
- waitForAnimationToEnd
- eraseText: 10
- eraseText: 1
- inputText: "2222"
- hideKeyboard

- tapOn:
    id: "sftp-username-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "sftp-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/upload/kopia-e2e"
- hideKeyboard

- tapOn:
    id: "sftp-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia123"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show validation error about host
- extendedWaitUntil:
    visible:
      text: ".*SFTP host is required.*"
    timeout: 5000

# ========================================
# Test 2: Missing username validation
# ========================================
# Navigate back and re-enter for fresh form
- back
# Welcome-only anchor: "Connect to Repository" would also match the Connect screen's own submit
# button (case-insensitive), so a silently failed `back` could re-submit the stale form.
- extendedWaitUntil:
    visible: "Browse and restore your Kopia backups"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-sftp"

# Fill everything except username
- tapOn:
    id: "sftp-host-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "10.0.2.2"
- hideKeyboard

- tapOn:
    id: "sftp-port-input"
- waitForAnimationToEnd
- eraseText: 10
- eraseText: 1
- inputText: "2222"
- hideKeyboard

# Skip Username intentionally

- tapOn:
    id: "sftp-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/upload/kopia-e2e"
- hideKeyboard

- tapOn:
    id: "sftp-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia123"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show validation error about username
- extendedWaitUntil:
    visible:
      text: ".*SFTP username is required.*"
    timeout: 5000

# ========================================
# Test 3: Wrong SFTP password -> SSH auth error
# ========================================
# Navigate back and re-enter for fresh form
- back
# Welcome-only anchor: "Connect to Repository" would also match the Connect screen's own submit
# button (case-insensitive), so a silently failed `back` could re-submit the stale form.
- extendedWaitUntil:
    visible: "Browse and restore your Kopia backups"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-sftp"

# Fill with wrong SFTP password
- tapOn:
    id: "sftp-host-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "10.0.2.2"
- hideKeyboard

- tapOn:
    id: "sftp-port-input"
- waitForAnimationToEnd
- eraseText: 10
- eraseText: 1
- inputText: "2222"
- hideKeyboard

- tapOn:
    id: "sftp-username-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "sftp-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/upload/kopia-e2e"
- hideKeyboard

- tapOn:
    id: "sftp-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "wrongpassword"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# The exact backend auth error, captured from the on-device hierarchy (2026-07-16): our literal
# prefix from SftpBlobStorage ("SSH authentication failed: <lib detail>"). Pin the stable prefix -
# the suffix comes from the SSH library and may change with its version.
- extendedWaitUntil:
    visible:
      text: ".*SSH authentication failed.*"
    timeout: 15000

