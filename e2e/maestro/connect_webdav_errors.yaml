# E2E Test: WebDAV Connection Error Handling
# Verifies proper error handling for invalid WebDAV credentials and missing fields.
#
# Prerequisites:
#   - Docker storage backends running (scripts/start_storage_backends.sh)
#   - Repositories seeded (scripts/seed_storage_backends.sh)
#
# Tests:
#   1. Missing URL -> validation error
#   2. Missing repository password -> validation error
#   3. Wrong WebDAV password -> HTTP 401 auth error
#   4. Wrong repository password -> repo auth error
#   5. Successful connection after errors (recovery test)
#
# UI is rendered in WebView (React app).
# NOTE: eraseText does not work reliably in WebView inputs. We navigate back
# and re-enter the Connect screen to get fresh empty fields between tests.
# hideKeyboard is called between fields to prevent the keyboard from
# obscuring lower fields and causing mistyped input.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Navigate to connect screen
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 15000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# Switch to WebDAV tab
- tapOn:
    id: "storage-tab-webdav"

# ========================================
# Test 1: Missing URL validation
# ========================================
# Fill everything except URL
- tapOn:
    id: "webdav-username-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "webdav-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia123"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show the exact validation error (ConnectScreen.validateForm literal).
- extendedWaitUntil:
    visible:
      text: ".*WebDAV URL is required.*"
    timeout: 5000

# ========================================
# Test 2: Missing repository password validation
# ========================================
# Navigate back and re-enter for fresh form
- back
# Welcome-only anchor: "Connect to Repository" would also match the Connect screen's own submit
# button (case-insensitive), so a silently failed `back` could re-submit the stale form.
- extendedWaitUntil:
    visible: "Browse and restore your Kopia backups"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-webdav"

# Fill URL but no repository password. Use a THROWAWAY url: a prior successful connect stores the
# repo password for the real WebDAV config ("Remember password" defaults ON) and ConnectScreen
# auto-fills it when the url matches - masking this empty-password validation on any second run
# (observed live 2026-07-16). Validation checks the password before the URL, so it needn't exist.
# Different HOST than the real backend so no typing-prefix of this URL ever transiently equals the
# stored URL (which would briefly trigger the auto-fill mid-typing).
- tapOn:
    id: "webdav-url-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "http://10.0.2.3:8080/e2e-validation-only/"
- hideKeyboard

# Cleartext http requires an explicit per-connection acknowledgment (task-23.2):
# the connect layer refuses an unacknowledged http:// endpoint. Ticked AFTER the
# endpoint is typed, since editing the endpoint resets the acknowledgment.
- tapOn:
    id: "webdav-cleartext-ack-checkbox"
- waitForAnimationToEnd

- tapOn:
    id: "webdav-username-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "webdav-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia123"
- hideKeyboard

# Skip Repository Password intentionally

- tapOn:
    id: "connect-button"

# Should show the exact validation error. The old ".*Repository password.*" alternative matched
# the static "Repository encryption password" label - a tautology that could never fail.
- extendedWaitUntil:
    visible:
      text: ".*Repository password is required.*"
    timeout: 5000

# ========================================
# Test 3: Wrong WebDAV password -> backend error
# ========================================
# Navigate back and re-enter for fresh form
- back
# Welcome-only anchor: "Connect to Repository" would also match the Connect screen's own submit
# button (case-insensitive), so a silently failed `back` could re-submit the stale form.
- extendedWaitUntil:
    visible: "Browse and restore your Kopia backups"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-webdav"

# Fill with wrong WebDAV credentials
- tapOn:
    id: "webdav-url-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "http://10.0.2.2:8080/"
- hideKeyboard

# Cleartext http requires an explicit per-connection acknowledgment (task-23.2):
# the connect layer refuses an unacknowledged http:// endpoint. Ticked AFTER the
# endpoint is typed, since editing the endpoint resets the acknowledgment.
- tapOn:
    id: "webdav-cleartext-ack-checkbox"
- waitForAnimationToEnd

- tapOn:
    id: "webdav-username-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "webdav-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "wrongpassword"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# The exact backend auth error, captured from the on-device hierarchy (2026-07-16): our WebDAV
# client formats it as "Unauthorized (HTTP 401)" (OkHttpWebDavClient status mapping).
- extendedWaitUntil:
    visible:
      text: ".*Unauthorized.*HTTP 401.*"
    timeout: 15000

