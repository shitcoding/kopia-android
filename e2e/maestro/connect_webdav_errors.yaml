- tapOn:
    id: "webdav-username-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "webdav-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia123"
- hideKeyboard

