- extendedWaitUntil:
    visible: "Browse and restore your Kopia backups"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-webdav"

# Fill with correct WebDAV credentials but wrong repo password
- tapOn:
    id: "webdav-url-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "http://10.0.2.2:8080/"
- hideKeyboard

# Cleartext http requires an explicit per-connection acknowledgment (task-23.2):
# the connect layer refuses an unacknowledged http:// endpoint. Ticked AFTER the
# endpoint is typed, since editing the endpoint resets the acknowledgment.
- tapOn:
    id: "webdav-cleartext-ack-checkbox"
- waitForAnimationToEnd

- tapOn:
    id: "webdav-username-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "webdav-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia123"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "wrongpassword"
