# Should show repo auth error
# The exact core error, captured on device (2026-07-16). The old ".*wrong.*" matched the typed
# "wrongpassword" input and ".*password.*" the static password label (tautologies).
- extendedWaitUntil:
    visible:
      text: ".*Invalid password or corrupted format blob.*"
    timeout: 15000

