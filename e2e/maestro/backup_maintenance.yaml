# E2E Test: Maintenance Screen
# Verifies the MaintenanceScreen renders correctly with action buttons
# Navigates via Settings -> Maintenance
# Repository: /sdcard/testrepo (edge_case_repo)
# Password: test123
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Connect to repository first
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 20000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- inputText: "/sdcard/testrepo"

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Wait for SnapshotsScreen
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 30000

# Navigate to Settings
- tapOn: "Settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000

# Scroll to Navigation section and tap Maintenance
- scroll
- scroll
- extendedWaitUntil:
    visible:
      text: ".*Maintenance.*"
    timeout: 5000
- tapOn:
    text: ".*Maintenance.*garbage collection.*"

# Wait for MaintenanceScreen
- extendedWaitUntil:
    visible:
      text: ".*Repository Maintenance.*"
    timeout: 10000

# Verify the explanation card
- assertVisible:
    text: ".*Repository Maintenance.*"
- assertVisible:
    text: ".*cleans up unused data.*"

# Scroll down to action buttons
- scroll

# Verify action buttons section
- assertVisible:
    text: ".*ACTIONS.*|.*Actions.*"
- assertVisible:
    text: ".*Run Quick Maintenance.*"
- assertVisible:
    text: ".*Run Full Maintenance.*"

# Navigate back using the back arrow
- tapOn: "Back"

# Verify we're back on settings or previous screen
- extendedWaitUntil:
    visible:
      text: ".*Settings.*|.*Snapshots.*"
    timeout: 5000
