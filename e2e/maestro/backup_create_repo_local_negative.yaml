# E2E Test: Create New Repository - Local Filesystem (Negative / Error Cases)
# Verifies that the create repository wizard shows proper error messages
# when given invalid inputs.
#
# Test scenarios:
#   1. Invalid repository path (non-writable / nonexistent parent)
#   2. Empty password
#   3. Mismatched passwords
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Wait for the welcome screen to load in WebView
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 20000

# ========================================
# Test 1: Invalid repository path
# ========================================

- tapOn: "Create New Repository"

- extendedWaitUntil:
    visible: "Create Repository"
    timeout: 5000

# Select Local Filesystem
- tapOn:
    id: "storage-option-local"

# Wait for step 2
- extendedWaitUntil:
    visible:
      text: ".*Configure.*Local Filesystem.*"
    timeout: 5000

# Enter an invalid path that cannot exist
- tapOn:
    id: "create-repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/invalid/nonexistent/path"

- hideKeyboard

# Test connection -- should fail
- tapOn:
    id: "test-connection-button"

# Positive error assertion: the local write-test fails for a non-writable path and shows a "Connection
# failed" toast (toasts persist in this app, so this is reliable - not just timing). Asserting the error
# (not only no-advance) is what makes this a real negative test.
- extendedWaitUntil:
    visible:
      text: ".*Connection failed.*"
    timeout: 15000
- assertVisible:
    text: ".*Connection failed.*"

# The wizard must NOT advance past step 2 (storage config).
# If the path is invalid, clicking "Test Connection" should keep us here.
- assertNotVisible:
    text: ".*encryption.*settings.*"
- assertNotVisible:
    text: ".*Backup Sources.*"

# ========================================
# Test 2: Empty password validation
# ========================================
# Start fresh to avoid back-navigation exiting the app
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 20000

- tapOn: "Create New Repository"

- extendedWaitUntil:
    visible: "Create Repository"
    timeout: 5000

- tapOn:
    id: "storage-option-local"

- extendedWaitUntil:
    visible:
      text: ".*Configure.*Local Filesystem.*"
    timeout: 5000

# Enter a valid path
- tapOn:
    id: "create-repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/KopiaNegativeTestRepo"

- hideKeyboard

- tapOn:
    id: "test-connection-button"

- extendedWaitUntil:
    visible:
      text: ".*Connection OK.*"
    timeout: 10000

- tapOn:
    text: "Next step"

# Step 3: Password screen
- extendedWaitUntil:
    visible:
      text: ".*encryption.*settings.*"
    timeout: 5000

# Do NOT enter a password -- try to proceed
- scroll
- scroll

# Try to tap Review without entering passwords
- tapOn:
    text: "Review settings"
    optional: true

# The form must NOT advance to step 4 (review) without a password.
- assertNotVisible:
    text: ".*Review your settings.*"
# Positive no-advance: confirm we're STILL on the password step. The "Review settings" tap above is
# optional (the button is disabled without a password), so assertNotVisible alone could pass even if the
# tap target simply weren't found - assert the password/encryption step is still shown.
- assertVisible:
    text: ".*encryption.*settings.*"

# ========================================
# Test 3: Mismatched passwords
# ========================================
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 20000

- tapOn: "Create New Repository"

- extendedWaitUntil:
    visible: "Create Repository"
    timeout: 5000

- tapOn:
    id: "storage-option-local"

- extendedWaitUntil:
    visible:
      text: ".*Configure.*Local Filesystem.*"
    timeout: 5000

# Enter a valid path
- tapOn:
    id: "create-repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/KopiaNegativeTestRepo"

- hideKeyboard

- tapOn:
    id: "test-connection-button"

- extendedWaitUntil:
    visible:
      text: ".*Connection OK.*"
    timeout: 10000

- tapOn:
    text: "Next step"

# Step 3: Password screen
- extendedWaitUntil:
    visible:
      text: ".*encryption.*settings.*"
    timeout: 5000

# Enter password
- tapOn:
    id: "create-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "testpassword123"
- hideKeyboard

# Enter different confirm password
- tapOn:
    id: "create-confirm-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "differentpassword456"

- hideKeyboard

# Positive error assertion: with both fields filled and differing, the form shows a persistent inline
# "Passwords don't match" error (rendered right under the confirm field while they differ) - assert it,
# not just that the wizard fails to advance.
- extendedWaitUntil:
    visible:
      text: ".*Passwords don't match.*"
    timeout: 10000
- assertVisible:
    text: ".*Passwords don't match.*"

- scroll

# Try to proceed
- tapOn:
    text: "Review settings"
    optional: true

# The form must NOT advance to step 4 (review) with mismatched passwords.
- assertNotVisible:
    text: ".*Review your settings.*"
