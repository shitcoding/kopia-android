# E2E Test: back up from the phone (the headline flow for task-30)
#
# Creates a repository, adds a source, taps "Back Up Now" and waits for a real snapshot to appear.
# The runner then runs verify_backup.sh, which pulls the repository off the device and has the
# HOST Go kopia binary list and restore the snapshot, comparing it byte-for-byte against the
# original the setup script retained. That comparison, not the UI, is the real assertion: an in-app
# restore would only verify the app against itself.
#
# "Start first backup immediately" is deliberately UNTICKED and the snapshot list is asserted EMPTY
# before the tap. The wizard defaults that checkbox on, so leaving it ticked would mean source
# creation ran the backup and this flow would pass with "Back Up Now" still stubbed.
#
# Category: backup. setup_backup_env.sh runs before every attempt (wipes the app, recreates the
# writable repo path and pushes a fresh deterministic source tree).
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
- runFlow:
    file: flows/_backup_prepare.yaml
    env:
      START_IMMEDIATELY: "false"
      EXCLUSIONS: ""
      SOURCE_PATH: "/sdcard/Download/phone_source"

# ===== Back Up Now =====
#
# Nothing has run yet: the shared preamble asserted the wizard's checkbox read
# "Start first backup immediately, off" before creating the source, so any snapshot below is this
# tap's doing. (Visiting the source's snapshot list to see the empty state first would be stronger
# still, and is now possible -- the app-bar buttons that did not respond when this was written were
# fixed in task-34/35, and backup_resume_after_cancel taps Back on that very screen.)

- tapOn:
    text: "Source options"
- tapOn:
    text: "Back Up Now"

# The progress sheet opens on the task id startBackup returned. Dismiss it and watch for the
# snapshot itself: a sheet appearing only proves a task was created, not that anything was written.
# The sheet is watched, not asserted: on this small tree the run can finish before Maestro looks, so
# demanding to SEE it is a race the flow does not need to run -- what it is really testing is that
# the tap produced a snapshot, which the assertions below and the Go byte comparison prove. If the
# sheet IS up, wait it out; if it never appeared, carry on.
- runFlow:
    when:
      visible:
        text: ".*Backup Progress.*"
    commands:
      - extendedWaitUntil:
          notVisible:
            text: ".*Backup Progress.*"
          timeout: 180000

# (What used to be here was a blind coordinate tap to dismiss the sheet. At 50%,15% it hits the app
# bar's "Add Source" whenever the sheet has already closed, which is every time the backup finishes
# first -- it failed exactly that way, on the Add Source screen. The suite has been caught by this
# tap before, in backup_task_survives_recreation at task-30.16.)

# ===== A real snapshot exists =====

- extendedWaitUntil:
    visible:
      text: ".*Backup Sources.*"
    timeout: 15000
- runFlow:
    file: flows/_open_source_snapshots.yaml

# Uploading 8 small files on a software-GPU emulator; generous, but a hang is a defect.
- extendedWaitUntil:
    visible: "Select snapshot 1"
    timeout: 180000

- assertVisible: "Select snapshot 1"
# Exactly one: a second would mean something ran a backup we did not ask for.
- assertNotVisible: "Select snapshot 2"
# The file count is load-bearing - it used to show files-hashed-this-run, rendering a whole tree as
# "1 files" (fixed in c002e16). The generated tree has 8 files and the default policy excludes none.
- assertVisible:
    text: ".*8 files.*"
