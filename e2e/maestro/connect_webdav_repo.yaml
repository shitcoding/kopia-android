# E2E Test: Connect to WebDAV Repository
# Verifies the complete connection flow for a WebDAV storage backend.
#
# Prerequisites:
#   - Docker storage backends running (scripts/start_storage_backends.sh)
#   - Repositories seeded (scripts/seed_storage_backends.sh)
#
# Repository: WebDAV at http://10.0.2.2:8080/
# Password: test123
# Expected: Connect successfully and see snapshot list
#
# UI is rendered in WebView (React app).
# NOTE: hideKeyboard is called between fields to prevent the keyboard from
# obscuring lower fields and causing mistyped input.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Wait for welcome screen and navigate to Connect
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 15000

- tapOn: "Connect to Repository"

# Wait for Connect Repository screen
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# Switch to WebDAV tab
- tapOn:
    id: "storage-tab-webdav"

# Fill WebDAV fields -- hide keyboard between each to keep all fields visible
- tapOn:
    id: "webdav-url-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "http://10.0.2.2:8080/"
- hideKeyboard

- tapOn:
    id: "webdav-username-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "webdav-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia123"
- hideKeyboard

# Scroll down to ensure repository password field is visible
- scroll

# Fill repository password
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard

# Tap Connect button
- tapOn:
    id: "connect-button"

# Wait for connection and verify success - should see Snapshots screen
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 60000
