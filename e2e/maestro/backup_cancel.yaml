# E2E Test: cancelling a running backup really reaches the worker (task-30.8)
#
# Cancellation is device-only behaviour - WorkManager plus a foreground service - and the bridge's
# cancelTask used to touch only TaskManager while the worker cancelled by work name, so a cancelled
# task left the backup running behind a cancelled-looking UI.
#
# Uses the larger source tree, because the small one finishes before Cancel could be tapped.
#
# Category: backup. No verify_backup arguments: this flow asserts the ABSENCE of a complete
# snapshot, and the verifier requires at least one.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
- runFlow:
    file: flows/_backup_prepare.yaml
    env:
      START_IMMEDIATELY: "false"
      EXCLUSIONS: ""
      SOURCE_PATH: "/sdcard/Download/phone_source_large"

# ===== Start, then cancel =====

- tapOn:
    text: "Source options"
- tapOn:
    text: "Back Up Now"
- extendedWaitUntil:
    visible:
      text: ".*Backup Progress.*"
    timeout: 30000

- tapOn:
    text: "Cancel Backup"
- extendedWaitUntil:
    # Escaped: Maestro matches text as a full-match regex, so a bare `?` is a quantifier and this
    # would be satisfied by the sheet's own "Cancel Backup" button without the dialog ever opening.
    visible: "Cancel Backup\\?"
    timeout: 15000
# By its own label: the sheet's button, the dialog's title and this button all carry the same text.
- tapOn:
    id: "confirm-cancel-backup-button"

# ===== Nothing complete was written =====

# The sheet now closes only when the task itself reports a terminal state, so its disappearance is
# real evidence that the cancel landed rather than evidence that the button was tapped (task-57:
# confirming the dialog used to close it unconditionally).
#
# The Idle wait below is not redundant with that. The sources list is polled separately, every 5s
# and only while something is UPLOADING, so the row can go on claiming a run after the sheet has
# gone — and tapping a row that claims one opens a progress sheet for a finished task, which closes
# itself instantly, instead of opening the source. That is how this flow failed: the tap looked
# ignored, with the dashboard still on screen 30s later.
- extendedWaitUntil:
    notVisible:
      text: ".*Backup Progress.*"
    timeout: 60000
# Wait for the row to stop claiming a run before tapping it, rather than racing the refetch above.
# The badge's own aria-label is invisible to Maestro — a source row is ONE button whose label
# overrides its whole subtree (task-42) — but the badge TEXT is in the hierarchy, and it reads
# "Uploading" while a run is on.
- extendedWaitUntil:
    visible: "Idle"
    timeout: 30000
- tapOn: "Source phone_source_large"
- extendedWaitUntil:
    visible:
      text: ".*Snapshots.*"
    timeout: 30000

# The invariant, and the only one worth asserting: a cancelled run produces NO COMPLETE SNAPSHOT.
# The header counts complete snapshots (task-56), so this holds whether or not the run left an
# incomplete manifest behind — and the empty-state text, which this flow used to assert, does not:
# an "Incomplete" row would make it red for something that is not a regression.
#
# What a UI cancel actually leaves was measured for task-57, twice, with the Go binary reading the
# pulled repository: ZERO manifests, complete or incomplete, while 279 MB of pack blobs from the
# cancelled run sit in it unreferenced. Both reviewers read the code as writing an incomplete
# manifest here (stopBackup prefers the cooperative BackupSessionRegistry.cancel, which is
# documented to drain and save one); the device disagrees, and why is task-58. If a row does start
# appearing here, that is that gap being closed, not this flow breaking.
#
# The leading space is load-bearing: text is matched as a FULL-match regex, so ".*0 snapshots.*"
# would also be satisfied by "10 snapshots".
- assertVisible:
    text: ".* 0 snapshots.*"
