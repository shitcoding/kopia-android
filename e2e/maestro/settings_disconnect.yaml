# E2E Test: Settings and Disconnect
# Verifies settings screen access, content, and repository disconnection via:
# 1. Settings screen Disconnect button
# 2. ExitDoor button (direct disconnect without going through Settings)
# Repository: /sdcard/testrepo (edge_case_repo)
# Password: test123
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Connect to repository first
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 30000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Wait for SnapshotsScreen
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 30000

# Navigate to settings via aria-label
- tapOn: "Settings"

# Verify settings screen appeared
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000

# Verify styling section exists
- assertVisible:
    text: ".*Styling.*|.*Theme.*"

# Verify about section exists
- assertVisible: "About"
- assertVisible: "KopiaKt"

# Scroll down to reveal Disconnect button at bottom of settings
- scroll
- scroll

# Verify Disconnect button is visible
- extendedWaitUntil:
    visible:
      text: ".*Disconnect.*"
    timeout: 5000

# Tap Disconnect
- tapOn:
    text: ".*Disconnect.*"

# Handle confirmation dialog if it appears
- runFlow:
    when:
      visible: "Disconnect Repository?"
    commands:
      - tapOn: "Disconnect"

# Verify we return to welcome/connect screen
- extendedWaitUntil:
    visible:
      text: "KopiaKt|Connect Repository|Connect to Repository"
    timeout: 10000

- assertVisible: "Connect to Repository"
