# E2E Test: Connect to edge_case_repo and verify connection
# Repository: /sdcard/testrepo (copy of edge_case_repo)
# Password: test123
# Expected: Successfully connect and see snapshot list
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Wait for home screen and navigate to Connect
- assertVisible: "Connect to Repository"
- tapOn: "Connect to Repository"

# Wait for Connect Repository screen
- assertVisible: "Connect Repository"

# Enter path
- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

# Enter password
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

# Hide keyboard and tap Connect button
- hideKeyboard
- tapOn:
    id: "connect-button"

# Wait for connection and verify success - should see snapshot list
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 15000

# Verify snapshot is loaded (76 files from edge_case_repo)
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 10000
