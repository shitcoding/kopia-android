# E2E Test: Add Backup Source - Negative / Error Cases
# Connects to an existing repository, navigates to Sources dashboard,
# and attempts to add a source with invalid inputs to verify error handling.
#
# Test scenarios:
#   1. Empty source path (try to proceed without entering path)
#   2. Invalid source path (non-existent directory)
#
# Prerequisites:
#   - Edge case repo must be pushed to /sdcard/testrepo on the device:
#     adb push kopiaKt/core/src/test/resources/fixtures/edge_case_repos/edge_case_repo /sdcard/testrepo
#   - Storage permissions granted:
#     adb shell appops set org.kopiaKt.app MANAGE_EXTERNAL_STORAGE allow
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# ===== Phase 1: Connect to Repository =====

- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 20000

- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    text: "Repository Path"
- inputText: "/sdcard/testrepo"

- tapOn:
    text: "Repository Password"
- inputText: "test123"

- hideKeyboard
- tapOn: "Connect"

# Wait for connection
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 30000

# ===== Phase 2: Navigate to Sources Dashboard =====

- tapOn: "Settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000

- scroll
- extendedWaitUntil:
    visible:
      text: ".*Sources.*"
    timeout: 5000
- tapOn:
    text: ".*Sources.*Manage.*"

- extendedWaitUntil:
    visible:
      text: ".*Backup Sources.*"
    timeout: 10000

# ===== Phase 3: Test Empty Path =====

# Navigate to Add Source screen
- runFlow:
    when:
      visible:
        text: ".*Add Your First Source.*"
    commands:
      - tapOn:
          text: ".*Add Your First Source.*"

- runFlow:
    when:
      visible:
        text: ".*Add Backup Source.*"
    commands:
      - tapOn:
          text: ".*Add Backup Source.*"

- extendedWaitUntil:
    visible:
      text: ".*Add Source.*"
    timeout: 5000

- assertVisible:
    text: ".*Choose a folder.*"

# Switch to manual path entry
- tapOn:
    text: ".*Enter path manually.*"

# Do NOT enter a path -- try to proceed with Next
- tapOn:
    text: "Next"
    optional: true

# The form must NOT advance to step 2 (schedule config) without a valid path.
- assertNotVisible:
    text: ".*Configure backup schedule.*"

# ===== Phase 4: Test Invalid Path =====
# The UI allows any non-empty path through to the next step (validation is
# deferred to source creation). So we walk through the wizard and verify
# that creating a source with an invalid path produces an error.

# Enter an invalid path
- tapOn:
    text: ".*emulated.*"
    optional: true
- inputText: "/nonexistent/invalid/backup/path"
- hideKeyboard

# Proceed through wizard steps
- tapOn:
    text: "Next"

- extendedWaitUntil:
    visible:
      text: ".*Configure backup schedule.*"
    timeout: 5000

# Skip policy config with defaults, go to review
- scroll
- tapOn:
    text: "Review"

- extendedWaitUntil:
    visible:
      text: ".*Review and add source.*"
    timeout: 5000

# Verify the invalid path is shown in review
- assertVisible:
    text: ".*nonexistent.*"

# Try to create source -- should fail with error toast
- tapOn:
    text: ".*Add Source.*"

# Wait briefly for the error to appear
- extendedWaitUntil:
    visible:
      text: ".*Failed.*|.*Error.*|.*error.*|.*not found.*|.*invalid.*"
    timeout: 10000
