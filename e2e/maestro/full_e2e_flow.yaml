# E2E Test: Complete End-to-End Flow
# Comprehensive test covering the entire user journey:
#   1. Welcome screen
#   2. Connect to local repository
#   3. View snapshot list (SnapshotsScreen)
#   4. Browse files via SourceSnapshotsScreen → FileBrowserScreen
#   5. Navigate directories
#   6. Restore snapshot via RestoreScreen
#   7. Settings
#   8. Disconnect
#   9. Return to welcome
#
# Repository: /sdcard/testrepo (edge_case_repo)
# Password: test123
#
# PREREQUISITE: Run setup_restore_dir.sh to create /sdcard/Download/_kopia_restore
#
# Navigation model: WelcomeScreen → ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# ========================================
# PHASE 1: Welcome Screen
# ========================================
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Verify welcome screen elements
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 30000

- assertVisible:
    text: ".*Browse and restore.*"

- assertVisible: "Connect to Repository"

# ========================================
# PHASE 2: Connect to Repository
# ========================================
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# Verify storage type tabs
- assertVisible:
    id: "storage-tab-local"
- assertVisible:
    id: "storage-tab-s3"

# Enter credentials
- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# ========================================
# PHASE 3: View Snapshots (SnapshotsScreen)
# ========================================
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 60000

# Verify source card with file count
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 10000

# Verify source card shows user@host format
- assertVisible:
    text: ".*@.*"

# ========================================
# PHASE 4: Browse Files via SourceSnapshotsScreen → FileBrowserScreen
# ========================================
# Tap source card → SourceSnapshotsScreen
- tapOn:
    text: ".*76 files.*"

# Verify SourceSnapshotsScreen header: "user@host · N snapshots"
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000

- assertVisible:
    text: ".*@.*"

# Tap first snapshot card → FileBrowserScreen
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- tapOn:
    text: ".*76.*files.*"

# Verify file browser loads
- extendedWaitUntil:
    visible:
      text: ".*hidden_dir.*"
    timeout: 15000

# Verify breadcrumb
- assertVisible: "/"

# ========================================
# PHASE 5: Navigate Directories
# ========================================
# Navigate into level1
- tapOn:
    text: ".*level1.*"

- extendedWaitUntil:
    visible:
      text: ".*level2.*"
    timeout: 10000

# Navigate deeper into level2
- tapOn:
    text: ".*level2.*"

- extendedWaitUntil:
    visible:
      text: ".*level3.*"
    timeout: 10000

# Navigate back to root using the "/" breadcrumb
- tapOn: "/"

# Verify back at root (shows hidden_dir etc)
- extendedWaitUntil:
    visible:
      text: ".*hidden_dir.*"
    timeout: 10000

# ========================================
# PHASE 6: Restore Flow (RestoreScreen)
# ========================================
# Tap app bar Restore icon to open RestoreScreen
- tapOn: "Restore"

- extendedWaitUntil:
    visible: "Select Destination"
    timeout: 20000

# Select destination
- tapOn: "Select Destination"

- extendedWaitUntil:
    visible:
      text: "Download|Documents|Downloads"
    timeout: 10000

- tapOn:
    text: "Download"
    optional: true

- runFlow:
    when:
      visible: "Downloads"
    commands:
      - tapOn: "Downloads"

- extendedWaitUntil:
    visible:
      text: "_kopia_restore|USE THIS FOLDER"
    timeout: 5000

- runFlow:
    when:
      visible: "_kopia_restore"
    commands:
      - tapOn: "_kopia_restore"

- extendedWaitUntil:
    visible: "USE THIS FOLDER"
    timeout: 5000

- tapOn: "USE THIS FOLDER"

- runFlow:
    when:
      visible: "ALLOW"
    commands:
      - tapOn: "ALLOW"

# Start restore
- extendedWaitUntil:
    visible: "Start Restore"
    timeout: 10000

- tapOn: "Start Restore"

# Wait for completion
- extendedWaitUntil:
    visible:
      text: ".*restored.*|.*Restore Complete.*"
    timeout: 300000

# ========================================
# PHASE 7: Settings
# ========================================
# Navigate back from RestoreScreen to SnapshotsScreen
# Stack: Snapshots -> SourceSnapshots -> FileBrowser -> Restore
# Need to go back through: Restore -> FileBrowser -> SourceSnapshots -> Snapshots
- back
- back
- back

- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 10000

# Go to settings
- tapOn: "Settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000

# Verify settings content
- assertVisible:
    text: ".*Styling.*|.*Theme.*|.*Dark.*"

# ========================================
# PHASE 8: Disconnect from Settings
# ========================================
- scroll
- scroll

- extendedWaitUntil:
    visible:
      text: ".*Disconnect.*"
    timeout: 5000

- tapOn:
    text: ".*Disconnect.*"

# Confirm disconnect if dialog appears
- runFlow:
    when:
      visible: "Disconnect Repository?"
    commands:
      - tapOn: "Disconnect"

# ========================================
# PHASE 9: Back at Welcome
# ========================================
- extendedWaitUntil:
    visible:
      text: "KopiaKt|Connect to Repository"
    timeout: 10000

- assertVisible: "Connect to Repository"

# Full E2E flow completed successfully!
