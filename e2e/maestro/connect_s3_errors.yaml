# The exact backend auth error, captured from the on-device hierarchy (2026-07-16): core's
# FormatBlobManager wraps MinIO's message as "Format blob not found: The Access Key Id you provided does not
# exist in our records. (Service: S3, Status Code: 403, Request ID: ...)". Pin the stable core
# (request IDs are per-run volatile; the sentence is MinIO's - revisit if the MinIO image changes).
- extendedWaitUntil:
    visible:
      text: ".*Access Key Id you provided does not exist.*"
    timeout: 15000

