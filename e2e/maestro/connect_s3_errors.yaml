# E2E Test: S3 Connection Error Handling
# Verifies proper error handling for invalid S3 credentials and missing fields.
#
# Prerequisites:
#   - Docker storage backends running (scripts/start_storage_backends.sh)
#   - Repositories seeded (scripts/seed_storage_backends.sh)
#
# Tests:
#   1. Missing bucket -> validation error
#   2. Missing secret key -> validation error
#   3. Wrong S3 credentials -> backend auth error
#   4. Wrong repository password -> repo auth error
#   5. Successful connection after errors (recovery test)
#
# UI is rendered in WebView (React app).
# NOTE: eraseText does not work reliably in WebView inputs. We navigate back
# and re-enter the Connect screen to get fresh empty fields between tests.
# hideKeyboard is called between fields to prevent the keyboard from
# obscuring lower fields and causing mistyped input.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Navigate to connect screen
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 15000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# Switch to S3 tab
- tapOn:
    id: "storage-tab-s3"

# ========================================
# Test 1: Missing bucket validation
# ========================================
# Fill everything except bucket
- tapOn:
    id: "s3-endpoint-input"
- longPressOn:
    id: "s3-endpoint-input"
- eraseText: 50
- waitForAnimationToEnd
- eraseText: 1
- inputText: "http://10.0.2.2:9000"
- hideKeyboard

# Cleartext http requires an explicit per-connection acknowledgment (task-23.2):
# the connect layer refuses an unacknowledged http:// endpoint. Ticked AFTER the
# endpoint is typed, since editing the endpoint resets the acknowledgment.
- tapOn:
    id: "s3-cleartext-ack-checkbox"
- waitForAnimationToEnd

- tapOn:
    id: "s3-access-key-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "s3-secret-key-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia123456"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show the exact validation error (ConnectScreen.validateForm literal).
- extendedWaitUntil:
    visible:
      text: ".*S3 bucket is required.*"
    timeout: 5000

# ========================================
# Test 2: Missing secret key validation
# ========================================
# Navigate back and re-enter for fresh form
- back
# Welcome-only anchor: "Connect to Repository" would also match the Connect screen's own submit
# button (case-insensitive), so a silently failed `back` could re-submit the stale form.
- extendedWaitUntil:
    visible: "Browse and restore your Kopia backups"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-s3"

# Fill everything except secret key
- tapOn:
    id: "s3-bucket-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia-e2e"
- hideKeyboard

- tapOn:
    id: "s3-endpoint-input"
- longPressOn:
    id: "s3-endpoint-input"
- eraseText: 50
- waitForAnimationToEnd
- eraseText: 1
- inputText: "http://10.0.2.2:9000"
- hideKeyboard

# Cleartext http requires an explicit per-connection acknowledgment (task-23.2):
# the connect layer refuses an unacknowledged http:// endpoint. Ticked AFTER the
# endpoint is typed, since editing the endpoint resets the acknowledgment.
- tapOn:
    id: "s3-cleartext-ack-checkbox"
- waitForAnimationToEnd

- tapOn:
    id: "s3-access-key-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

# Skip Secret Access Key intentionally

- scroll

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show the exact validation error (ConnectScreen.validateForm literal).
- extendedWaitUntil:
    visible:
      text: ".*Secret access key is required.*"
    timeout: 5000

