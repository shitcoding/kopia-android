# E2E Test: S3 Connection Error Handling
# Verifies proper error handling for invalid S3 credentials and missing fields.
#
# Prerequisites:
#   - Docker storage backends running (scripts/start_storage_backends.sh)
#   - Repositories seeded (scripts/seed_storage_backends.sh)
#
# Tests:
#   1. Missing bucket -> validation error
#   2. Missing secret key -> validation error
#   3. Wrong S3 credentials -> backend auth error
#   4. Wrong repository password -> repo auth error
#   5. Successful connection after errors (recovery test)
#
# UI is rendered in WebView (React app).
# NOTE: eraseText does not work reliably in WebView inputs. We navigate back
# and re-enter the Connect screen to get fresh empty fields between tests.
# hideKeyboard is called between fields to prevent the keyboard from
# obscuring lower fields and causing mistyped input.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Navigate to connect screen
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 15000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# Switch to S3 tab
- tapOn:
    id: "storage-tab-s3"

# ========================================
# Test 1: Missing bucket validation
# ========================================
# Fill everything except bucket
- tapOn:
    id: "s3-endpoint-input"
- longPressOn:
    id: "s3-endpoint-input"
- eraseText: 50
- inputText: "http://10.0.2.2:9000"
- hideKeyboard

- tapOn:
    id: "s3-access-key-input"
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "s3-secret-key-input"
- inputText: "kopia123456"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show validation error about bucket
- extendedWaitUntil:
    visible:
      text: ".*bucket.*required.*|.*Bucket.*required.*"
    timeout: 5000

# ========================================
# Test 2: Missing secret key validation
# ========================================
# Navigate back and re-enter for fresh form
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-s3"

# Fill everything except secret key
- tapOn:
    id: "s3-bucket-input"
- inputText: "kopia-e2e"
- hideKeyboard

- tapOn:
    id: "s3-endpoint-input"
- longPressOn:
    id: "s3-endpoint-input"
- eraseText: 50
- inputText: "http://10.0.2.2:9000"
- hideKeyboard

- tapOn:
    id: "s3-access-key-input"
- inputText: "kopia"
- hideKeyboard

# Skip Secret Access Key intentionally

- scroll

- tapOn:
    id: "repo-password-input"
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show validation error about secret key
- extendedWaitUntil:
    visible:
      text: ".*[Ss]ecret.*key.*required.*|.*access key.*required.*"
    timeout: 5000

# ========================================
# Test 3: Wrong S3 credentials -> backend auth error
# ========================================
# Navigate back and re-enter for fresh form
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-s3"

# Fill with wrong S3 credentials
- tapOn:
    id: "s3-bucket-input"
- inputText: "kopia-e2e"
- hideKeyboard

- tapOn:
    id: "s3-endpoint-input"
- longPressOn:
    id: "s3-endpoint-input"
- eraseText: 50
- inputText: "http://10.0.2.2:9000"
- hideKeyboard

- tapOn:
    id: "s3-access-key-input"
- inputText: "wrong-key"
- hideKeyboard

- tapOn:
    id: "s3-secret-key-input"
- inputText: "wrong-secret"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show backend authentication error
- extendedWaitUntil:
    visible:
      text: ".*invalid.*|.*denied.*|.*failed.*|.*error.*|.*credentials.*|.*403.*|.*Access Denied.*"
    timeout: 15000

# ========================================
# Test 4: Wrong repository password -> repo auth error
# ========================================
# Navigate back and re-enter for fresh form
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-s3"

# Fill with correct S3 credentials but wrong repo password
- tapOn:
    id: "s3-bucket-input"
- inputText: "kopia-e2e"
- hideKeyboard

- tapOn:
    id: "s3-endpoint-input"
- longPressOn:
    id: "s3-endpoint-input"
- eraseText: 50
- inputText: "http://10.0.2.2:9000"
- hideKeyboard

- tapOn:
    id: "s3-access-key-input"
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "s3-secret-key-input"
- inputText: "kopia123456"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- inputText: "wrongpassword"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should show error (repo auth)
- extendedWaitUntil:
    visible:
      text: ".*invalid.*|.*incorrect.*|.*failed.*|.*error.*|.*wrong.*|.*password.*"
    timeout: 15000

# ========================================
# Test 5: Successful connection after errors (recovery)
# ========================================
# Navigate back and re-enter for fresh form
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000
- tapOn:
    id: "storage-tab-s3"

# Fill with correct credentials
- tapOn:
    id: "s3-bucket-input"
- inputText: "kopia-e2e"
- hideKeyboard

- tapOn:
    id: "s3-endpoint-input"
- longPressOn:
    id: "s3-endpoint-input"
- eraseText: 50
- inputText: "http://10.0.2.2:9000"
- hideKeyboard

- tapOn:
    id: "s3-access-key-input"
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "s3-secret-key-input"
- inputText: "kopia123456"
- hideKeyboard

- scroll

- tapOn:
    id: "repo-password-input"
- inputText: "test123"
- hideKeyboard

- tapOn:
    id: "connect-button"

# Should navigate to Snapshots screen after successful connection
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 30000
