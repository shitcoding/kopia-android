# E2E Test: Connect to S3 (MinIO) Repository
# Verifies the complete connection flow for an S3-compatible storage backend.
#
# Prerequisites:
#   - Docker storage backends running (scripts/start_storage_backends.sh)
#   - Repositories seeded (scripts/seed_storage_backends.sh)
#
# Repository: S3 bucket "kopia-e2e" on MinIO at http://10.0.2.2:9000
# Password: test123
# Expected: Connect successfully and see snapshot list
#
# UI is rendered in WebView (React app).
# NOTE: hideKeyboard is called between fields to prevent the keyboard from
# obscuring lower fields and causing mistyped input. Fields with default
# values (Endpoint) use clearText instead of eraseText for reliability.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Wait for welcome screen and navigate to Connect
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 15000

- tapOn: "Connect to Repository"

# Wait for Connect Repository screen
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# Switch to S3 tab
- tapOn:
    id: "storage-tab-s3"

# Fill S3 fields -- hide keyboard between each to keep all fields visible
- tapOn:
    id: "s3-bucket-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia-e2e"
- hideKeyboard

# Endpoint field has a default value "s3.amazonaws.com" -- clear it first
# Use long press + select all to ensure full clearing in WebView
- tapOn:
    id: "s3-endpoint-input"
- longPressOn:
    id: "s3-endpoint-input"
- eraseText: 50
- waitForAnimationToEnd
- eraseText: 1
- inputText: "http://10.0.2.2:9000"
- hideKeyboard

# Region field defaults to "us-east-1" which is what we want -- leave it

- tapOn:
    id: "s3-access-key-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia"
- hideKeyboard

- tapOn:
    id: "s3-secret-key-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "kopia123456"
- hideKeyboard

# Scroll down to make password field visible
- scroll

# Fill repository password
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

# Hide keyboard before tapping Connect
- hideKeyboard

# Tap Connect button
- tapOn:
    id: "connect-button"

# Wait for connection and verify success - should see Snapshots screen
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 30000
