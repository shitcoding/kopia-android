# E2E Test: Restore files from edge_case_repo snapshot
# Repository: /sdcard/testrepo (copy of edge_case_repo)
# Password: test123
# Expected: Navigate to restore screen, select destination, complete restore
#
# This test validates the complete restore flow including file content reading.
#
# NOTE: Flutter Semantics.identifier is not being exposed to Android accessibility
# services, so we use text-based selectors instead of id-based ones.

appId: org.kopiaKt.app

---
# Clear app state and start fresh
- clearState
- launchApp

# Connect to repository
- assertVisible: "Connect to Repository"
- tapOn: "Connect to Repository"
- assertVisible: "Connect Repository"

# Tap on path field
- tapOn:
    text: "Repository Path"
- inputText: "/sdcard/testrepo"

# Tap on password field
- tapOn:
    text: "Repository Password"
- inputText: "test123"

- hideKeyboard
- tapOn: "Connect"

# Wait for snapshot list to appear
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 15000

# Wait for data to load
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 10000

# Tap on snapshot card
- tapOn:
    text: ".*76 files.*"

# Wait for file browser screen to load
- extendedWaitUntil:
    visible:
      text: ".*hidden_dir.*"
    timeout: 15000

# Verify we're in file browser
- assertVisible:
    text: ".*hidden_dir.*"

# Tap restore button (in top bar) - look for "Restore this folder" tooltip
- tapOn:
    text: ".*Restore.*"

# Verify restore screen appeared
- extendedWaitUntil:
    visible: "Select Destination"
    timeout: 5000

# Verify source path shown (accessibility text is "Source\n/")
- assertVisible:
    text: ".*Source.*"

# Tap Select Destination to open SAF picker
- tapOn: "Select Destination"

# Wait for SAF picker to appear
- extendedWaitUntil:
    visible:
      text: "Download|Documents"
    timeout: 10000

# Navigate to Download folder
- tapOn: "Download"

# Wait for Download folder to load
- extendedWaitUntil:
    visible:
      text: "restore_dest|edge_restored|CREATE NEW FOLDER"
    timeout: 5000

# Navigate into restore_dest subfolder
- tapOn: "restore_dest"

# Now we should be able to use this folder
- extendedWaitUntil:
    visible: "USE THIS FOLDER"
    timeout: 5000

- tapOn: "USE THIS FOLDER"

# Handle ALLOW permission dialog if shown
- runFlow:
    when:
      visible: "ALLOW"
    commands:
      - tapOn: "ALLOW"

# After selecting destination, should see Start Restore button enabled
- extendedWaitUntil:
    visible: "Start Restore"
    timeout: 10000

# Start restore
- tapOn: "Start Restore"

# Wait for restore to complete OR fail
# The restore screen shows:
# - "Preparing restore..." initially
# - "Restoring file X of Y..." during restore
# - "Restore Complete! N files restored" on success
# - "Restore Failed" on error
- extendedWaitUntil:
    visible:
      text: ".*files restored.*|.*Restore Failed.*|.*Restoring.*|.*Preparing restore.*"
    timeout: 15000

# Now wait for restore to actually complete
- extendedWaitUntil:
    visible:
      text: ".*files restored.*|.*Restore Failed.*"
    timeout: 300000
