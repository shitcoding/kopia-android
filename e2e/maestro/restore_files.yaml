# E2E Test: Restore files from edge_case_repo snapshot via RestoreScreen
# Repository: /sdcard/testrepo (copy of edge_case_repo)
# Password: test123
# Expected: Navigate to RestoreScreen, select destination, complete restore
#
# PREREQUISITE: Run setup_restore_dir.sh to create /sdcard/Download/_kopia_restore
#
# Navigation: ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen → RestoreScreen
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
---
# Clear app state and start fresh
- clearState
- launchApp

# Wait for WebView to load
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 20000

# Connect to repository
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    text: "Repository Path"
- inputText: "/sdcard/testrepo"

- tapOn:
    text: "Repository Password"
- inputText: "test123"

- hideKeyboard
- tapOn: "Connect"

# Wait for SnapshotsScreen (key derivation may take time)
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 30000

# Wait for source card
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 10000

# Tap source card → SourceSnapshotsScreen
- tapOn:
    text: ".*76 files.*"

# SourceSnapshotsScreen: tap first snapshot card → FileBrowserScreen
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- tapOn:
    text: ".*76.*files.*"

# Wait for file browser to load
- extendedWaitUntil:
    visible:
      text: ".*hidden_dir.*"
    timeout: 15000

# Tap Download icon in app bar to open RestoreScreen
- tapOn:
    point: "80%,7%"

# Verify restore screen appeared
- extendedWaitUntil:
    visible: "Select Destination"
    timeout: 10000

# Verify source path is shown
- assertVisible:
    text: ".*Source.*"

# Tap Select Destination to open SAF picker
- tapOn: "Select Destination"

# Wait for SAF picker
- extendedWaitUntil:
    visible:
      text: "Download|Documents|Downloads"
    timeout: 10000

- tapOn:
    text: "Download"
    optional: true

- runFlow:
    when:
      visible: "Downloads"
    commands:
      - tapOn: "Downloads"

# Navigate into _kopia_restore folder
- extendedWaitUntil:
    visible:
      text: "_kopia_restore|USE THIS FOLDER|CREATE NEW FOLDER"
    timeout: 5000

- runFlow:
    when:
      visible: "_kopia_restore"
    commands:
      - tapOn: "_kopia_restore"

- extendedWaitUntil:
    visible: "USE THIS FOLDER"
    timeout: 5000

- tapOn: "USE THIS FOLDER"

# Handle ALLOW permission dialog if shown
- runFlow:
    when:
      visible: "ALLOW"
    commands:
      - tapOn: "ALLOW"

# Start Restore button should now be enabled
- extendedWaitUntil:
    visible: "Start Restore"
    timeout: 10000

- tapOn: "Start Restore"

# Wait for restore to start then complete
- extendedWaitUntil:
    visible:
      text: ".*Preparing.*|.*Restoring.*|.*restored.*"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*restored.*|.*Restore Complete.*"
    timeout: 300000
