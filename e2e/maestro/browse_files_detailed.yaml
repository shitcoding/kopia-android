# E2E Test: Detailed File Browsing
# Verifies file browser functionality, breadcrumb navigation, folder traversal
# Repository: /sdcard/testrepo (edge_case_repo)
# Password: test123
# Expected: Navigate folders, verify breadcrumbs update, navigate back
#
# Navigation: WelcomeScreen → ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
---
# Clear app state and start fresh
- clearState
- launchApp

# Connect to repository
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 10000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    text: "Repository Path"
- inputText: "/sdcard/testrepo"

- tapOn:
    text: "Repository Password"
- inputText: "test123"

- hideKeyboard
- tapOn: "Connect"

# Wait for SnapshotsScreen source card
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 15000

# Tap source card → SourceSnapshotsScreen
- tapOn:
    text: ".*76 files.*"

# Wait for SourceSnapshotsScreen
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000

# Tap first snapshot card → FileBrowserScreen
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- tapOn:
    text: ".*76.*files.*"

# Verify file browser opens with root breadcrumb
- extendedWaitUntil:
    visible: "/"
    timeout: 10000

# Verify we see root directory contents
- extendedWaitUntil:
    visible:
      text: ".*hidden_dir.*"
    timeout: 10000

# Verify root listing shows expected edge case entries
- assertVisible:
    text: ".*many_files.*"

- assertVisible:
    text: ".*level1.*"

# Scroll to see more files if needed
- scroll

# Wait for content to settle after scroll before checking visibility
- extendedWaitUntil:
    visible:
      text: ".*double_dot.*|.*binary.*|.*unicode.*|.*hidden.*|.*level.*"
    timeout: 8000

# Scroll back to top to restore known positions
- scroll
- scroll

# Navigate into level1 folder for nested navigation test
# Wait for level1 to be visible at its position after scroll
- extendedWaitUntil:
    visible:
      text: ".*level1.*"
    timeout: 5000

- tapOn:
    text: ".*level1.*"

- extendedWaitUntil:
    visible:
      text: ".*level2.*"
    timeout: 10000

- assertVisible:
    text: ".*level2.*"
