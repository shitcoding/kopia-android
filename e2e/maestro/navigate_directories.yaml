# E2E Test: Navigate into nested directories
# Repository: /sdcard/testrepo (copy of edge_case_repo)
# Password: test123
# Expected: Navigate from root -> nested/level1 -> level2 and verify contents
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app

---
# Clear app state and start fresh
- clearState
- launchApp

# Connect to repository
- assertVisible: "Connect to Repository"
- tapOn: "Connect to Repository"
- assertVisible: "Connect Repository"

# Tap on path field
- tapOn:
    text: "Repository Path"
- inputText: "/sdcard/testrepo"

# Tap on password field
- tapOn:
    text: "Repository Password"
- inputText: "test123"

- hideKeyboard
- tapOn: "Connect"

# Wait for snapshot list to appear
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 15000

# Wait for data to load
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 10000

# Tap on snapshot card to enter file browser
- tapOn:
    text: ".*76 files.*"

# Wait for file browser screen to load (root level)
- extendedWaitUntil:
    visible:
      text: ".*level1.*"
    timeout: 15000

# Verify we see the level1 folder at root level
- assertVisible:
    text: ".*level1.*"

# Tap on level1 folder to navigate into it
- tapOn:
    text: ".*level1.*"

# Wait for level2 to appear (proving we navigated into level1)
- extendedWaitUntil:
    visible:
      text: ".*level2.*"
    timeout: 10000

# Verify we navigated into level1 (now shows level2 inside)
- assertVisible:
    text: ".*level2.*"

# Continue deeper - tap on level2
- tapOn:
    text: ".*level2.*"

# Wait for level3 to appear
- extendedWaitUntil:
    visible:
      text: ".*level3.*"
    timeout: 10000

# Verify we navigated into level2 (shows level3)
- assertVisible:
    text: ".*level3.*"
