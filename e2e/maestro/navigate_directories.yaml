# E2E Test: Navigate into nested directories
# Repository: /sdcard/testrepo (copy of edge_case_repo)
# Password: test123
# Expected: Navigate from root -> level1 -> level2 -> level3 and verify contents
#
# Navigation: WelcomeScreen → ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Connect to repository
- assertVisible: "Connect to Repository"
- tapOn: "Connect to Repository"
- assertVisible: "Connect Repository"

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Wait for SnapshotsScreen
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 60000

# Wait for source card with file count
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 10000

# Tap source card → SourceSnapshotsScreen
- tapOn:
    text: ".*76 files.*"

# Wait for SourceSnapshotsScreen
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000

# Tap first snapshot card → FileBrowserScreen
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- tapOn:
    text: ".*76.*files.*"

# Wait for file browser screen to load (root level)
- extendedWaitUntil:
    visible: "/"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*level1.*"
    timeout: 10000

# Verify we see the level1 folder at root level
- assertVisible:
    text: ".*level1.*"

# Tap on level1 folder to navigate into it
- tapOn:
    text: ".*level1.*"

# Wait for level2 to appear (proving we navigated into level1)
- extendedWaitUntil:
    visible:
      text: ".*level2.*"
    timeout: 10000

# Verify we navigated into level1 (now shows level2 inside)
- assertVisible:
    text: ".*level2.*"

# Continue deeper - tap on level2
- tapOn:
    text: ".*level2.*"

# Wait for level3 to appear
- extendedWaitUntil:
    visible:
      text: ".*level3.*"
    timeout: 10000

# Verify we navigated into level2 (shows level3)
- assertVisible:
    text: ".*level3.*"
