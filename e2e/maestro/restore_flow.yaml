# E2E Test: Complete Restore Flow via RestoreScreen
# Verifies the RestoreScreen (full snapshot restore via app bar Download icon)
# Repository: /sdcard/testrepo (edge_case_repo)
# Password: test123
# Expected: Navigate to RestoreScreen, select destination, start restore, verify completion
#
# PREREQUISITE: Run setup_restore_dir.sh to create /sdcard/Download/_kopia_restore
#
# Navigation: ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen → RestoreScreen
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- clearState
- launchApp

# Connect to repository
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 20000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    text: "Repository Path"
- inputText: "/sdcard/testrepo"

- tapOn:
    text: "Repository Password"
- inputText: "test123"

- hideKeyboard
- tapOn: "Connect"

# SnapshotsScreen: tap source card
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 30000
- tapOn:
    text: ".*76 files.*"

# SourceSnapshotsScreen: tap first snapshot card
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- tapOn:
    text: ".*76.*files.*"

# FileBrowserScreen: wait for root listing
- extendedWaitUntil:
    visible:
      text: ".*hidden_dir.*"
    timeout: 15000

# Tap Restore icon in app bar to open RestoreScreen
- tapOn: "Restore"

# Verify RestoreScreen appeared (shows "Select Destination" or source info)
- extendedWaitUntil:
    visible: "Select Destination"
    timeout: 20000

# Verify source path is shown
- assertVisible:
    text: ".*Source.*"

# Tap Select Destination to open SAF picker
- tapOn: "Select Destination"

# Wait for SAF picker to appear (native Android UI)
- extendedWaitUntil:
    visible:
      text: "Download|Documents|Downloads"
    timeout: 10000

# Navigate to Download folder
- tapOn:
    text: "Download"
    optional: true

- runFlow:
    when:
      visible: "Downloads"
    commands:
      - tapOn: "Downloads"

# Navigate into _kopia_restore folder
- extendedWaitUntil:
    visible:
      text: "_kopia_restore|USE THIS FOLDER|CREATE NEW FOLDER"
    timeout: 5000

- runFlow:
    when:
      visible: "_kopia_restore"
    commands:
      - tapOn: "_kopia_restore"

# Use this folder
- extendedWaitUntil:
    visible: "USE THIS FOLDER"
    timeout: 5000
- tapOn: "USE THIS FOLDER"

# Handle ALLOW permission dialog if shown
- runFlow:
    when:
      visible: "ALLOW"
    commands:
      - tapOn: "ALLOW"

# After selecting destination, should see Start Restore button
- extendedWaitUntil:
    visible: "Start Restore"
    timeout: 10000

# Start restore
- tapOn: "Start Restore"

# Wait for restore to start
- extendedWaitUntil:
    visible:
      text: ".*Preparing.*|.*Restoring.*|.*restored.*"
    timeout: 15000

# Wait for restore to complete (76 files, may take a while)
- extendedWaitUntil:
    visible:
      text: ".*restored.*|.*Restore Complete.*"
    timeout: 300000
