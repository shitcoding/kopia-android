# E2E Test: Add Backup Source (creation only)
# Connects to a repository, navigates to Sources, adds a source via manual path entry, walks the
# policy/review wizard, creates the source, and verifies the created source ROW appears.
#
# NOTE: this verifies source *creation* only. No backup runs — the bridge `startBackup` is a stub and
# `createSource` ignores the "Start first backup immediately" checkbox (tracked product dependency).
# Do NOT add backup-execution assertions here until that is wired.
#
# Flow:
#   1. Connect to existing edge_case_repo (/sdcard/testrepo, password: test123)
#   2. Navigate to Settings -> Sources
#   3. Tap "Add ... Source"
#   4. Enter source path manually (/sdcard/Download)
#   5. Configure policy (keep defaults)
#   6. Review and create the source
#   7. Verify the created source row (its path) appears on the Sources dashboard
#
# Prerequisites:
#   - Edge case repo must be pushed to /sdcard/testrepo on the device:
#     adb push core/src/test/resources/fixtures/edge_case_repos/edge_case_repo /sdcard/testrepo
#   - /sdcard/Download must exist on device (default Android directory)
#   - Storage permissions granted:
#     adb shell appops set org.kopiaKt.app MANAGE_EXTERNAL_STORAGE allow
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# ===== Phase 1: Connect to Repository =====

- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 20000

- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Wait for connection (key derivation may take time)
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 30000

# ===== Phase 2: Navigate to Sources Dashboard =====

# Open Settings
- tapOn: "Settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000

# Scroll to Navigation section and tap Sources
- scroll
- extendedWaitUntil:
    visible:
      text: ".*Sources.*"
    timeout: 5000
- tapOn:
    text: ".*Sources.*Manage.*"

# Wait for SourcesDashboardScreen
- extendedWaitUntil:
    visible:
      text: ".*Backup Sources.*"
    timeout: 10000

# ===== Phase 3: Add Backup Source =====

# Navigate to Add Source screen (handles both empty and non-empty states)
# Use a single tap that matches either button variant
- tapOn:
    text: ".*Add.*Source.*"

# Wait for AddSourceScreen - use specific text to avoid matching dashboard buttons
- extendedWaitUntil:
    visible:
      text: ".*Choose a folder.*"
    timeout: 5000

# Step 1: Choose folder to back up
# Use manual path entry instead of SAF folder picker
- tapOn:
    text: ".*Enter path manually.*"

# Tap on the revealed input field and enter path
# The placeholder text is "/storage/emulated/0/..."
- tapOn:
    id: "source-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/Download"
- hideKeyboard

# Tap Next to go to policy step
- tapOn:
    text: "Next step"

# Step 2: Configure policy (keep defaults: auto backup every 24 hours, ZSTD)
- extendedWaitUntil:
    visible:
      text: ".*Configure backup schedule.*"
    timeout: 5000

# Verify default settings are visible
- assertVisible:
    text: ".*Automatic backups.*"
- assertVisible:
    text: ".*ZSTD.*"

# Scroll to see the Review button (exclusions textarea may push it below fold)
- scroll

# Proceed with defaults
- tapOn:
    text: "Review settings"

# Step 3: Review and add source
- extendedWaitUntil:
    visible:
      text: ".*Review and add source.*"
    timeout: 5000

# Verify summary shows correct values
- assertVisible:
    text: ".*Download.*"
- assertVisible:
    text: ".*Every 24 hours.*"
- assertVisible:
    text: ".*ZSTD.*"

# Verify "Start first backup immediately" checkbox is visible
- assertVisible:
    text: ".*Start first backup immediately.*"

# Tap "Add Source" button.
- tapOn:
    id: "add-source-button"

# ===== Phase 4: Verify the created source ROW appears (not just the page header) =====
# createSource registers the source and the app navigates back to the dashboard. Assert the new
# source's path is rendered as a row — a unique post-action signal that the source was actually
# created (the page header alone would show even if creation failed and we never left the wizard).
- extendedWaitUntil:
    visible:
      text: ".*Backup Sources.*"
    timeout: 30000
# The new source row's accessible name is "Source <basename>" (AddSourceScreen renders the basename;
# the full path is not a matchable text node). For /sdcard/Download that is "Source Download".
- extendedWaitUntil:
    visible:
      text: "Source Download"
    timeout: 10000
- assertVisible:
    text: "Source Download"
