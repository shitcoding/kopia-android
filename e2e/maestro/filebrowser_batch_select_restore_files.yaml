# E2E Test: FileBrowser batch selection and restore of individual files
# Tests multi-select, SAF folder picker, per-file restore flow
# Repository: /sdcard/testrepo
# Password: test123
# Restore destination: /sdcard/Download/_kopia_restore
#
# PREREQUISITE: Run scripts/setup_restore_dir.sh to create /sdcard/Download/_kopia_restore
#
# Navigation: ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen → level1/
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Connect to repository
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 10000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# SnapshotsScreen: tap source card
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 15000
- tapOn:
    text: ".*76 files.*"

# SourceSnapshotsScreen: tap first snapshot card
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- tapOn:
    text: ".*76.*files.*"

# FileBrowserScreen root: wait for known entries
- extendedWaitUntil:
    visible: "/"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: ".*hidden_dir.*"
    timeout: 10000

# Enter selection mode by long-pressing on the hidden_dir row
- longPressOn:
    text: "Folder hidden_dir"

# Wait for selection toolbar (text may be split across lines in WebView)
- extendedWaitUntil:
    visible:
      text: ".*selected.*"
    timeout: 10000

- assertVisible:
    text: ".*selected.*"

# Tap "level1" to add a second item to selection
- tapOn:
    text: ".*level1.*"

# Wait for updated selection count (text may be split across lines)
- extendedWaitUntil:
    visible:
      text: ".*selected.*"
    timeout: 5000

- assertVisible:
    text: ".*selected.*"

# Verify toolbar buttons visible
- assertVisible: "Select all"
- assertVisible: "Restore selected"

# Tap Restore to open RestoreScreen
- tapOn: "Restore selected"

# Wait for RestoreScreen and tap Select Destination to open SAF picker
- extendedWaitUntil:
    visible: "Select Destination"
    timeout: 10000
- tapOn: "Select Destination"

# SAF picker: wait for it to appear (native Android UI)
- extendedWaitUntil:
    visible:
      text: "Download|Downloads|Documents"
    timeout: 10000

# Navigate to Download folder
- tapOn:
    text: "Download"
    optional: true

- runFlow:
    when:
      visible: "Downloads"
    commands:
      - tapOn: "Downloads"

# Navigate into _kopia_restore folder
- extendedWaitUntil:
    visible:
      text: "_kopia_restore|USE THIS FOLDER|CREATE NEW FOLDER"
    timeout: 5000

- runFlow:
    when:
      visible: "_kopia_restore"
    commands:
      - tapOn: "_kopia_restore"

# Tap USE THIS FOLDER
- extendedWaitUntil:
    visible: "USE THIS FOLDER"
    timeout: 5000
- tapOn: "USE THIS FOLDER"

# Handle optional ALLOW permission dialog
- runFlow:
    when:
      visible: "ALLOW"
    commands:
      - tapOn: "ALLOW"

# RestoreScreen should be visible, tap "Start Restore" to begin the restore
- extendedWaitUntil:
    visible: "Start Restore"
    timeout: 5000
- tapOn: "Start Restore"

# Wait for restore progress or completion
- extendedWaitUntil:
    visible:
      text: ".*Restoring.*|.*Restore complete.*|.*restored.*"
    timeout: 15000

# Wait for restore to complete
- extendedWaitUntil:
    visible:
      text: ".*Restore Complete.*"
    timeout: 60000

- assertVisible:
    text: ".*Restore Complete.*"

# Tap Done to clear the restore bar
- tapOn: "Dismiss restore complete"

# Verify selection mode cleared and normal file list shown
- extendedWaitUntil:
    notVisible:
      text: ".*Restore Complete.*"
    timeout: 3000
