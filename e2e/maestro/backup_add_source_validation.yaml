# E2E Test: Add Backup Source - wizard path validation
# Connects to a repository, opens the Add Source wizard, and verifies the CLIENT-SIDE path gate:
# an empty path must NOT advance the wizard, and a valid path MUST advance it.
#
# Test scenarios:
#   1. Empty source path -> the "Next step" button is gated; the wizard stays on step 1.
#   2. Valid source path -> the wizard advances to the schedule step.
#
# NOTE: there is intentionally NO "invalid path -> error" scenario. `createSource` does not validate
# the path (it accepts any non-empty string and registers the source in memory — tracked product
# dependency), so an "invalid path" produces no error. The only real, mutation-testable negative here
# is the empty-path client gate (AddSourceScreen disables "Next" when the path is blank).
#
# Prerequisites:
#   - Edge case repo must be pushed to /sdcard/testrepo on the device:
#     adb push core/src/test/resources/fixtures/edge_case_repos/edge_case_repo /sdcard/testrepo
#   - Storage permissions granted:
#     adb shell appops set org.kopiaKt.app MANAGE_EXTERNAL_STORAGE allow
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# ===== Phase 1: Connect to Repository =====

- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 20000

- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Wait for connection
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 60000

# ===== Phase 2: Navigate to Sources Dashboard =====

- tapOn: "Settings"

- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000

- scroll
- extendedWaitUntil:
    visible:
      text: ".*Sources.*"
    timeout: 5000
- tapOn:
    text: ".*Sources.*Manage.*"

- extendedWaitUntil:
    visible:
      text: ".*Backup Sources.*"
    timeout: 10000

# ===== Phase 3: Test Empty Path =====

# Navigate to Add Source screen
- runFlow:
    when:
      visible:
        text: ".*Add Your First Source.*"
    commands:
      - tapOn:
          text: ".*Add Your First Source.*"

- runFlow:
    when:
      visible:
        text: ".*Add Backup Source.*"
    commands:
      - tapOn:
          text: ".*Add Backup Source.*"

- extendedWaitUntil:
    visible:
      text: ".*Add Source.*"
    timeout: 5000

- assertVisible:
    text: ".*Choose a folder.*"

# Switch to manual path entry
- tapOn:
    text: ".*Enter path manually.*"

# Do NOT enter a path -- try to proceed with Next
- tapOn:
    text: "Next step"
    optional: true

# The form must NOT advance to step 2 (schedule config) without a valid path.
- assertNotVisible:
    text: ".*Configure this source.*"

# ===== Phase 4: A valid path advances the wizard (positive control) =====
# This makes the empty-path assertion above meaningful: the gate must respond to path PRESENCE,
# not be permanently blocked. Enter a valid path (we're still on step 1) and confirm step 2 is
# reached. A mutation that removes the empty-path gate would make Phase 3 fail; one that always
# blocks "Next" would make this phase fail.
- tapOn:
    id: "source-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/Download"
- hideKeyboard

- tapOn:
    text: "Next step"

- extendedWaitUntil:
    visible:
      text: ".*Configure this source.*"
    timeout: 5000
