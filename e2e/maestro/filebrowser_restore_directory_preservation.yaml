# E2E Test: FileBrowser directory restore with name preservation
# Tests that restoring a directory preserves its name (not flattened into destination)
# Repository: /sdcard/testrepo
# Password: test123
# Restore destination: /sdcard/Download/_kopia_restore
#
# PREREQUISITE: Run scripts/setup_restore_dir.sh to create /sdcard/Download/_kopia_restore
#
# After completion, verify via adb:
#   adb shell ls /sdcard/Download/_kopia_restore
#   → should contain "level1/" (not level1's contents at root)
#
# Navigation: ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Connect to repository
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 10000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# SnapshotsScreen → SourceSnapshotsScreen
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 15000
- tapOn:
    text: ".*76 files.*"

# SourceSnapshotsScreen → FileBrowserScreen
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- tapOn:
    text: ".*76.*files.*"

# FileBrowserScreen root: wait for level1 folder
- extendedWaitUntil:
    visible: "/"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: ".*level1.*"
    timeout: 10000

# Enter selection mode by long-pressing on the level1 folder row
- longPressOn:
    text: "Folder level1"

# Wait for selection toolbar (text may be split across lines in WebView)
- extendedWaitUntil:
    visible:
      text: ".*selected.*"
    timeout: 10000

- assertVisible:
    text: ".*selected.*"
- assertVisible: "Restore selected"

# Tap Restore to open SAF folder picker directly
- tapOn: "Restore selected"

# SAF picker: navigate to _kopia_restore
- extendedWaitUntil:
    visible:
      text: "Download|Downloads|Documents"
    timeout: 10000

- tapOn:
    text: "Download"
    optional: true

- runFlow:
    when:
      visible: "Downloads"
    commands:
      - tapOn: "Downloads"

- extendedWaitUntil:
    visible:
      text: "_kopia_restore|USE THIS FOLDER|CREATE NEW FOLDER"
    timeout: 5000

- runFlow:
    when:
      visible: "_kopia_restore"
    commands:
      - tapOn: "_kopia_restore"

- extendedWaitUntil:
    visible: "USE THIS FOLDER"
    timeout: 5000
- tapOn: "USE THIS FOLDER"

# Handle optional ALLOW permission dialog
- runFlow:
    when:
      visible: "ALLOW"
    commands:
      - tapOn: "ALLOW"

# Restore starts automatically after folder selection
# Wait for restore to complete (progress may be too fast to catch)
- extendedWaitUntil:
    visible:
      text: ".*Restoring.*|.*Restore complete.*|.*restored.*"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*Restore Complete.*"
    timeout: 120000

- assertVisible:
    text: ".*Restore Complete.*"

# Test passed - restore completed successfully
# The "Restore complete" banner is shown with a "Done" button.
# We skip dismissing it since the core test assertion (restore completion) has passed.

# NOTE: To verify directory structure preservation, run:
# adb shell ls /sdcard/Download/_kopia_restore
# Expected: level1/  (directory with its name preserved, not flattened contents)
