# E2E Test: Browse Snapshots
# Verifies snapshot list display, SourceSnapshotsScreen, and navigation to file browser
# Repository: /sdcard/testrepo (edge_case_repo)
# Password: test123
# Expected: See source list, tap source card, see SourceSnapshotsScreen, tap snapshot, browse files
#
# Navigation: WelcomeScreen → ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Connect to repository
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 10000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Wait for SnapshotsScreen
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 15000

# Verify Snapshots title is shown
- assertVisible: "Snapshots"

# Wait for source card to load (shows total file count)
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 10000

# Verify source card shows user@host format
- assertVisible:
    text: ".*@.*"

# Tap on the source card (contains "76 files") to open SourceSnapshotsScreen
- tapOn:
    text: ".*76 files.*"

# SourceSnapshotsScreen: wait for " · N snapshots" in the source header
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000

# Assert source header format: "user@host · N snapshots"
- assertVisible:
    text: ".*@.*"

# Snapshot cards show file/dir/size stats. Tap the first snapshot card (its body button)
# The card shows date at top; tap by the file count stat which is unique on this screen
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000

- tapOn:
    text: ".*76.*files.*"

# Wait for FileBrowserScreen — breadcrumb "/" appears
- extendedWaitUntil:
    visible: "/"
    timeout: 15000

# Verify root directory contents are shown
- extendedWaitUntil:
    visible:
      text: ".*hidden_dir.*|.*level1.*|.*many_files.*"
    timeout: 10000

# Verify breadcrumb shows root
- assertVisible: "/"
