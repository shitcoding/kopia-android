# E2E Test: Welcome Screen - Create New Repository button
# Verifies the new "Create New Repository" button on the welcome screen
# Expected: Button visible, navigates to CreateRepositoryScreen with storage type selector
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# WebView may need a moment to load
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 30000

# Wait for full page render including buttons
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 10000

# Verify the existing Connect to Repository button
- assertVisible: "Connect to Repository"

# Verify the new Create New Repository button
- assertVisible: "Create New Repository"

# Tap Create New Repository
- tapOn: "Create New Repository"

# Verify navigation to CreateRepositoryScreen
- extendedWaitUntil:
    visible: "Create Repository"
    timeout: 5000

# Verify step 1: storage type selection is shown
- assertVisible:
    text: ".*store your repository.*"

# Verify storage type options are displayed (regex for WebView text)
- assertVisible:
    text: ".*Local Filesystem.*"
- assertVisible:
    text: ".*Amazon S3.*"
- assertVisible:
    text: ".*WebDAV.*"
- assertVisible:
    text: ".*SFTP.*"

# Navigate back to welcome screen using the back button
- tapOn: "Back"

# Verify we returned to the welcome screen
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 5000

- assertVisible: "Create New Repository"
