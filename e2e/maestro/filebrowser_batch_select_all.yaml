# E2E Test: FileBrowser Select All and Deselect
# Tests Select All button selects entire visible directory, Deselect clears
# Repository: /sdcard/testrepo
# Password: test123
#
# Navigation: ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Connect to repository
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 10000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# SnapshotsScreen → SourceSnapshotsScreen
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 60000
- tapOn:
    text: ".*76 files.*"

# SourceSnapshotsScreen → FileBrowserScreen
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- tapOn:
    text: ".*76.*files.*"

# FileBrowserScreen root: wait for file list
- extendedWaitUntil:
    visible: "/"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: ".*level1.*"
    timeout: 10000

# Enter selection mode by long-pressing on the hidden_dir row
- longPressOn:
    text: "Folder .hidden_dir"

# Long-pressing one row selects exactly ONE item -> assert the exact count, not just ".*selected.*".
- extendedWaitUntil:
    visible:
      text: ".*1 selected.*"
    timeout: 10000

- assertVisible:
    text: ".*1 selected.*"
- assertVisible: "Select all"

# Dismiss any system context menu by tapping on a neutral area (middle of file list)
- tapOn:
    point: "50%,70%"

# Wait for selection toolbar to stabilize after context menu dismissal
- extendedWaitUntil:
    visible: "Select all"
    timeout: 5000

# Tap Select All using id to avoid collision with system "Select all" context menu
- tapOn:
    id: "select-all-button"

# Verify "Deselect" appears (meaning all items selected, same button toggles)
# The visible text is "Deselect" and aria-label is "Deselect all"
- extendedWaitUntil:
    visible:
      text: ".*Deselect.*"
    timeout: 5000

- assertVisible:
    text: ".*Deselect.*"

# Selection mode is still active (a count is shown). The exact total isn't a fixed small number, so
# this stays loose; the "Deselect" toggle above already proves ALL items are selected.
- assertVisible:
    text: ".*selected.*"

# Tap Deselect to clear all (same button, toggled state)
- tapOn:
    id: "select-all-button"

# Wait for "Select All" to reappear (Deselect toggled back)
# and count should be 0 or the toolbar should update
- extendedWaitUntil:
    visible: "Select all"
    timeout: 5000

# Tap X to exit selection mode
- tapOn: "Clear selection"

# Verify normal file list icons are restored (no checkboxes)
# and selection toolbar is gone
- extendedWaitUntil:
    notVisible: "selected"
    timeout: 5000
