# E2E Test: sources and a running task survive process death and activity recreation
# (task-30.3 singletons, task-30.7 persistence)
#
# Sources lived in a map inside KopiaWebBridge, which is rebuilt per MainActivity, so a configured
# folder vanished on a ROTATION - not merely on process death. Persisting them (30.7) fixes the
# source list, but a per-bridge manager would reload it and a source-list assertion would stay green;
# the singleton defect is only observable through state that is NOT persisted, which is the in-flight
# task. So this checks both: the source survives a restart, and a RUNNING backup survives a rotation.
#
# Category: backup.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
- runFlow:
    file: flows/_backup_prepare.yaml
    env:
      START_IMMEDIATELY: "false"
      EXCLUSIONS: ""
      SOURCE_PATH: "/sdcard/Download/phone_source"

# ===== The source survives process death =====

- stopApp
- launchApp
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 40000

- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 15000
- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/backup_e2e_repo"
- hideKeyboard
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "testpassword123"
- hideKeyboard
- tapOn:
    id: "connect-button"
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 90000

- runFlow:
    file: flows/_goto_sources.yaml

# Still there after the process was killed and the app reconnected.
- assertVisible: "Source phone_source"

# ===== A running task survives activity recreation =====

- tapOn:
    text: "Source options"
- tapOn:
    text: "Back Up Now"
- extendedWaitUntil:
    visible:
      text: ".*Backup Progress.*"
    timeout: 30000

# Rotation used to recreate MainActivity, which is exactly what took the TaskManager - and with it
# the running backup - away. task-35 stopped the recreation (the activity now handles orientation
# itself), so this asks the UI directly rather than working around a welcome screen.
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd

# The welcome screen is what a recreated activity produced, every time, whatever the user was doing.
# Asserting its absence rather than the progress sheet's presence keeps this honest: eight small
# files can finish uploading before the rotation lands, and a flow that then failed would be
# reporting a race, not a regression.
- assertNotVisible: "Connect to Repository"

- setOrientation: PORTRAIT
- waitForAnimationToEnd
- assertNotVisible: "Connect to Repository"

# Dismiss the progress sheet and wait for the snapshot itself. A sheet only ever proved a task was
# created; the snapshot appearing is the proof the task ran to completion across the rotation, and
# the runner's verify_backup.sh then asserts exactly one landed in the repository.
- tapOn:
    point: "50%,15%"
- extendedWaitUntil:
    visible:
      text: ".*Backup Sources.*"
    timeout: 20000
- tapOn: "Source phone_source"
- extendedWaitUntil:
    visible: "Select snapshot 1"
    timeout: 180000
