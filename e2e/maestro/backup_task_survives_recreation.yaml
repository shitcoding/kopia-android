# E2E Test: sources and a running task survive process death and activity recreation
# (task-30.3 singletons, task-30.7 persistence)
#
# Sources lived in a map inside KopiaWebBridge, which is rebuilt per MainActivity, so a configured
# folder vanished on a ROTATION - not merely on process death. Persisting them (30.7) fixes the
# source list, but a per-bridge manager would reload it and a source-list assertion would stay green;
# the singleton defect is only observable through state that is NOT persisted, which is the in-flight
# task. So this checks both: the source survives a restart, and a RUNNING backup survives a rotation.
#
# It backs up the LARGE tree, like backup_cancel and for the same reason (task-54): the small one is
# eight tiny files that finish in seconds, so the run this flow needs to still be in flight was
# usually over before the rotation landed. The flow then had to assert something weaker - that the
# welcome screen had not appeared - and even getting that far depended on catching a progress sheet
# that a finished run had already closed, which failed outright on 2026-08-06. With a run that
# outlives the rotation, the sheet is a reliable signal and this can assert what it is named for:
# the task is STILL THERE afterwards.
#
# What it no longer does is write and verify a snapshot; backup_run_local already backs up the small
# tree, asserts exactly one snapshot with the right file count, and has the Go binary restore it
# byte-for-byte. Duplicating that here bought nothing and is what tied this flow to a backup too
# short to rotate during -- and it could not have been kept anyway, since verify_backup.sh compares
# against the small tree alone and the large one is generated on the device with no host original.
#
# Deliberately NOT covered by anything now: that a backup spanning a rotation runs to COMPLETION. A
# rotation that stalled the worker without killing the task would leave the sheet up and pass here.
# That assertion was almost always vacuous before this change too -- the run had usually finished
# before the rotation landed -- so this records a gap rather than opening one.
#
# Category: backup. The run is cancelled at the end, so nothing here waits on 190 MB completing.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
- runFlow:
    file: flows/_backup_prepare.yaml
    env:
      START_IMMEDIATELY: "false"
      EXCLUSIONS: ""
      SOURCE_PATH: "/sdcard/Download/phone_source_large"

# ===== The source survives process death =====

- stopApp
- launchApp
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 40000

- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 15000
- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/backup_e2e_repo"
- hideKeyboard
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "testpassword123"
- hideKeyboard
- tapOn:
    id: "connect-button"
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 90000

- runFlow:
    file: flows/_goto_sources.yaml

# Still there after the process was killed and the app reconnected.
- assertVisible: "Source phone_source_large"

# ===== A running task survives activity recreation =====

- tapOn:
    text: "Source options"
- tapOn:
    text: "Back Up Now"
- extendedWaitUntil:
    visible:
      text: ".*Backup Progress.*"
    timeout: 30000

# Rotation used to recreate MainActivity, which is exactly what took the TaskManager - and with it
# the running backup - away. task-35 stopped the recreation (the activity now handles orientation
# itself).
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd

# The task is still running and still being watched. A recreated activity produced the welcome
# screen instead, every time, whatever the user was doing - so both assertions describe the same
# defect, and the sheet is the one that says the TASK survived rather than merely the screen.
- extendedWaitUntil:
    visible:
      text: ".*Backup Progress.*"
    timeout: 15000
- assertNotVisible: "Connect to Repository"

# ===== Leave nothing running =====
#
# Not because 190 MB could not finish -- setup measured ~5 MB/s, so it would land inside a minute --
# but because a run still uploading when the next flow's setup wipes the app is how an emulator ends
# up wedged, and because letting it complete would put the sheet's self-close back in the way of
# these steps. The size is load-bearing in both directions: large enough to still be running at the
# rotation, small enough that the whole flow fits the 600s timeout.
- tapOn:
    text: "Cancel Backup"
- extendedWaitUntil:
    # Escaped: Maestro matches text as a full-match regex, so a bare `?` is a quantifier and this
    # would be satisfied by the sheet's own "Cancel Backup" button without the dialog ever opening.
    visible: "Cancel Backup\\?"
    timeout: 15000
# By its own label: the sheet's button, the dialog's title and this button all carry the same text.
- tapOn:
    id: "confirm-cancel-backup-button"
- extendedWaitUntil:
    notVisible:
      text: ".*Backup Progress.*"
    timeout: 60000

# The sheet closes as soon as the task is cancelled, which says nothing about the WORKER: the cancel
# reaches it through BackupSessionRegistry and a WorkManager cancel, and backup_cancel.yaml is what
# proves that landed (it asserts no snapshot was written). Here the point is only to leave the
# emulator clean, so take the guarantee rather than infer it.
- stopApp

# Put the device back the way it was found. setup_backup_env.sh forces portrait before each backup
# flow precisely because this one rotates, but that leaves the device sideways for anything run
# outside the runner - and it turns the next flow's own startup into a rotation, which is a config
# change like any other.
- setOrientation: PORTRAIT
