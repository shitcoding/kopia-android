# E2E Test: Browse files in edge_case_repo snapshot
# Repository: /sdcard/testrepo (copy of edge_case_repo)
# Password: test123
# Expected: Connect to repo, view snapshot list, browse root file listing
#
# UI is rendered in WebView (React app).
#
# KNOWN BUG: Directory navigation (tapping folders) updates the title bar but
# doesn't actually navigate into the subdirectory. This test currently only
# validates root-level file browsing.

appId: org.kopiaKt.app
---
# Clear app state and start fresh
- clearState
- launchApp

# Connect to repository
- assertVisible: "Connect to Repository"
- tapOn: "Connect to Repository"
- assertVisible: "Connect Repository"

# Tap on path field
- tapOn:
    text: "Repository Path"
- inputText: "/sdcard/testrepo"

# Tap on password field
- tapOn:
    text: "Repository Password"
- inputText: "test123"

- hideKeyboard
- tapOn: "Connect"

# Wait for snapshot list to appear
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 15000

# Verify snapshot data loaded (76 files)
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 10000

# Tap on snapshot card to enter file browser
- tapOn:
    text: ".*76 files.*"

# Wait for file browser screen to load
- extendedWaitUntil:
    visible:
      text: ".*hidden_dir.*"
    timeout: 15000

# Verify root directory listing shows expected edge case entries
- assertVisible:
    text: ".*hidden_dir.*"

- assertVisible:
    text: ".*many_files.*"

- assertVisible:
    text: ".*level1.*"

# Scroll down to see more files
- scroll

# Verify we can see more edge case files after scrolling
- extendedWaitUntil:
    visible:
      text: ".*double_dot.*"
    timeout: 5000
