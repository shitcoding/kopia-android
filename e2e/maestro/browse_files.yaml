# E2E Test: Browse files in edge_case_repo snapshot
# Repository: /sdcard/testrepo (copy of edge_case_repo)
# Password: test123
# Expected: Navigate through directories, verify file listing

appId: org.kopiaKt.app
---
# Clear app state and start fresh
- clearState
- launchApp

# Connect to repository
- assertVisible: "Connect to Repository"
- tapOn: "Connect to Repository"
- assertVisible: "Connect Repository"

- tapOn:
    id: "repo_path_field"
- inputText: "/sdcard/testrepo"

- tapOn:
    id: "password_field"
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect_button"

# Wait for snapshot list to be ready
- extendedWaitUntil:
    visible:
      id: "snapshot_list_ready"
    timeout: 15000

# Verify Snapshots title is visible
- assertVisible: "Snapshots"

# Tap on snapshot card (first card in list)
- tapOn:
    point: "50%,30%"

# Wait for file browser to be ready (state-based semantics)
- extendedWaitUntil:
    visible:
      id: "file_browser_ready"
    timeout: 15000

# Verify level1 folder is visible
- assertVisible:
    id: "file_entry_level1"

# Navigate into level1 folder using semantic identifier
- tapOn:
    id: "file_entry_level1"

# Wait for nested directory to load
- extendedWaitUntil:
    visible:
      id: "file_browser_ready"
    timeout: 5000

# Verify level2 is visible
- assertVisible:
    id: "file_entry_level2"

# Go back
- back

# Wait for parent directory to reload
- extendedWaitUntil:
    visible:
      id: "file_browser_ready"
    timeout: 5000

# Verify we're back at root
- assertVisible:
    id: "file_entry_level1"

# Navigate into many_files directory
- tapOn:
    id: "file_entry_many_files"

# Wait for file browser to load
- extendedWaitUntil:
    visible:
      id: "file_browser_ready"
    timeout: 5000

# Verify files are listed - many_files contains file_001.txt through file_050.txt
- assertVisible:
    id: "file_entry_file_001.txt"
