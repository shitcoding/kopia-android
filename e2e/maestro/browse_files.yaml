# E2E Test: Browse files in edge_case_repo snapshot
# Repository: /sdcard/testrepo (copy of edge_case_repo)
# Password: test123
# Expected: Connect to repo, view source list, navigate SourceSnapshotsScreen, browse root file listing
#
# Navigation: WelcomeScreen → ConnectScreen → SnapshotsScreen → SourceSnapshotsScreen → FileBrowserScreen
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Connect to repository
- assertVisible: "Connect to Repository"
- tapOn: "Connect to Repository"
- assertVisible: "Connect Repository"

- tapOn:
    id: "repo-path-input"
- inputText: "/sdcard/testrepo"

- tapOn:
    id: "repo-password-input"
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Wait for SnapshotsScreen
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 15000

# Wait for source card with file count
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 10000

# Tap source card → SourceSnapshotsScreen
- tapOn:
    text: ".*76 files.*"

# Wait for SourceSnapshotsScreen — " · N snapshots" in header
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000

# Tap first snapshot card → FileBrowserScreen
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- tapOn:
    text: ".*76.*files.*"

# Wait for file browser to load
- extendedWaitUntil:
    visible: "/"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*hidden_dir.*"
    timeout: 10000

# Verify root directory listing shows expected edge case entries
- assertVisible:
    text: ".*hidden_dir.*"

- assertVisible:
    text: ".*many_files.*"

- assertVisible:
    text: ".*level1.*"

# Scroll down to see more files
- scroll

# Verify we can see more edge case files after scrolling
- extendedWaitUntil:
    visible:
      text: ".*double_dot.*"
    timeout: 5000
