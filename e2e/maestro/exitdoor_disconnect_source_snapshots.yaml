# E2E Test: ExitDoor disconnect from SourceSnapshotsScreen
# Verifies the ExitDoor (disconnect) button on SourceSnapshotsScreen returns to ConnectScreen
# Repository: /sdcard/testrepo
# Password: test123
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Connect to repository
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 10000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# SnapshotsScreen: tap source card → SourceSnapshotsScreen
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 15000
- tapOn:
    text: ".*76 files.*"

# Verify SourceSnapshotsScreen
- extendedWaitUntil:
    visible:
      text: ".*@.*"
    timeout: 10000

- assertVisible:
    text: ".* snapshots"

# Tap ExitDoor button (title="Disconnect")
- tapOn: "Disconnect"

# Verify we returned to ConnectScreen
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- assertVisible:
    id: "storage-tab-local"
- assertVisible:
    id: "storage-tab-s3"
