# E2E Test: Connection Error Handling
# Verifies proper error handling for invalid credentials and missing repos
# Expected: Show appropriate error messages without crashing
#
# UI is rendered in WebView (React app).
# NOTE: eraseText does not work reliably in WebView inputs. We navigate back
# and re-enter the Connect screen to get fresh empty fields between tests.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Navigate to connect screen
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 10000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# ========================================
# Test 1: Empty path validation
# ========================================
# Try to connect without entering path
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard
- tapOn:
    id: "connect-button"

# Should show the exact validation error. (The old ".*Repository path.*" alternative also matched the
# static field label, so it could pass without any error - a false pass. Assert the exact message.)
- extendedWaitUntil:
    visible:
      text: ".*Repository path is required.*"
    timeout: 5000

# ========================================
# Test 2: Empty password validation
# ========================================
# Enter path only, clear password.
# NOTE (follow-up): /sdcard/testrepo is reused by Test 3 (which needs a VALID repo for the wrong-password
# case). If a prior connect stored this repo's password ("Remember password"), ConnectScreen could
# auto-fill it here and mask the empty-password validation (a flaky false-FAILURE). Robust fix: clear
# stored credentials in setup, or split Test 2 onto a throwaway path and re-enter the repo in Test 3.
- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- eraseText: 100

- hideKeyboard
- tapOn:
    id: "connect-button"

# Should show the exact validation error (not the static "Repository password" field label).
- extendedWaitUntil:
    visible:
      text: ".*Repository password is required.*"
    timeout: 5000

# ========================================
# Test 3: Wrong password
# ========================================
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "wrongpassword"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Wrong password for a VALID repo -> connection fails. Dropped the ".*wrong.*" alternative: it matched
# the typed "wrongpassword" input (still in the DOM), not an error - the original false pass. NOTE: the
# displayed message is the React "Failed to connect to repository" fallback, NOT the core's
# "Invalid password..." string (verified on device), so this stays a focused set of failure terms; pin
# to the exact on-device text as a follow-up.
- extendedWaitUntil:
    visible:
      text: ".*invalid.*|.*incorrect.*|.*failed.*|.*error.*"
    timeout: 15000

# ========================================
# Test 4: Non-existent path
# ========================================
# Navigate back to Welcome and re-enter Connect screen (fresh form)
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/nonexistent_repo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Non-existent path -> connection fails. Dropped the ".*directory.*" alternative: it matched the static
# "...repository directory on the device" help text on the Connect screen (a false pass). Kept
# ".*must be.*" (matches the core "Base path must be a directory") plus the generic failure terms so it
# still matches whichever message the bridge surfaces; pin to the exact on-device text as a follow-up.
- extendedWaitUntil:
    visible:
      text: ".*not found.*|.*does not exist.*|.*failed.*|.*error.*|.*must be.*"
    timeout: 15000

# ========================================
# Test 5: Successful connection after errors
# ========================================
# Navigate back to Welcome and re-enter Connect screen (fresh form)
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Should successfully connect
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 60000
