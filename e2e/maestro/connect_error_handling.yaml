# E2E Test: Connection Error Handling
# Verifies proper error handling for invalid credentials and missing repos
# Expected: Show appropriate error messages without crashing
#
# UI is rendered in WebView (React app).
# NOTE: eraseText does not work reliably in WebView inputs. We navigate back
# and re-enter the Connect screen to get fresh empty fields between tests.
#
# Prerequisite: edge_case_repo fixture at /sdcard/testrepo (password: test123) - pushed by
# scripts/setup_test_repo.sh (run_e2e.sh does this automatically).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Navigate to connect screen
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 10000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# ========================================
# Test 1: Empty path validation
# ========================================
# Try to connect without entering path
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard
- tapOn:
    id: "connect-button"

# Should show the exact validation error. (The old ".*Repository path.*" alternative also matched the
# static field label, so it could pass without any error - a false pass. Assert the exact message.)
- extendedWaitUntil:
    visible:
      text: ".*Repository path is required.*"
    timeout: 5000

# ========================================
# Test 2: Empty password validation
# ========================================
# Enter a THROWAWAY path, clear password. A never-connected path cannot have a stored password, so
# ConnectScreen's auto-fill effect can't race the empty-password validation here (a remembered
# /sdcard/testrepo password used to make this flaky; the effect actively clears the password for
# unknown paths). Validation checks the password before the path, so the path needn't exist.
- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/e2e_validation_only"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- eraseText: 100

- hideKeyboard
- tapOn:
    id: "connect-button"

# Should show the exact validation error (not the static "Repository password" field label).
- extendedWaitUntil:
    visible:
      text: ".*Repository password is required.*"
    timeout: 5000

# ========================================
# Test 3: Wrong password
# ========================================
# Navigate back and re-enter Connect for a FRESH form. Test 2 filled the path field, and eraseText
# cannot reliably clear a FILLED WebView field: the tap can drop the cursor mid-text and erase only
# what is left of it (observed live: clearing "/sdcard/e2e_validation_only" + retyping produced
# "/sdcard/testrepon_only"). Fresh empty fields only need the eraseText:1 CDP primer.
- back
# Anchor on a WELCOME-ONLY text before tapping. Waiting for "Connect to Repository" here could
# match the Connect screen's own "Connect to repository" button (case-insensitive), so if `back`
# ever silently failed, the tap would re-submit the stale form. (The app title "KopiaKt" is no
# anchor either - the WebView node carries it as document title on EVERY screen.)
- extendedWaitUntil:
    visible: "Browse and restore your Kopia backups"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

# Path first, password last: entering a known path can trigger the stored-password auto-fill effect
# ("Remember password" defaults ON, so other flows may have stored /sdcard/testrepo's password).
# ConnectScreen clears an auto-filled field entirely on the FIRST edit (swallowing that keystroke),
# so typing below yields "wrongpassword" or a suffix of it - wrong either way, and the asserted
# error is reached with or without a stored password.
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "wrongpassword"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Wrong password for a VALID repo -> the EXACT core error, captured from the on-device view
# hierarchy (2026-07-16). Generic terms like ".*wrong.*" previously false-passed by matching the
# typed "wrongpassword" input still in the DOM. (An earlier session believed the app showed a
# "Failed to connect to repository" fallback instead of this string - that was a degraded-emulator
# misread; the bridge relays the core exception message verbatim.)
- extendedWaitUntil:
    visible:
      text: ".*Invalid password or corrupted format blob.*"
    timeout: 15000

# ========================================
# Test 4: Non-existent path
# ========================================
# Navigate back to Welcome and re-enter Connect screen (fresh form)
- back
# Anchor on a WELCOME-ONLY text before tapping. Waiting for "Connect to Repository" here could
# match the Connect screen's own "Connect to repository" button (case-insensitive), so if `back`
# ever silently failed, the tap would re-submit the stale form. (The app title "KopiaKt" is no
# anchor either - the WebView node carries it as document title on EVERY screen.)
- extendedWaitUntil:
    visible: "Browse and restore your Kopia backups"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/nonexistent_repo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Non-existent path -> the EXACT storage error, captured from the on-device view hierarchy
# (2026-07-16). The message embeds the requested path, so it cannot match the static
# "...repository directory on the device" help text (the old ".*directory.*" false pass) or the
# typed path input.
- extendedWaitUntil:
    visible:
      text: ".*Base path must be a directory: /sdcard/nonexistent_repo.*"
    timeout: 15000

# ========================================
# Test 5: Successful connection after errors
# ========================================
# Navigate back to Welcome and re-enter Connect screen (fresh form)
- back
# Anchor on a WELCOME-ONLY text before tapping. Waiting for "Connect to Repository" here could
# match the Connect screen's own "Connect to repository" button (case-insensitive), so if `back`
# ever silently failed, the tap would re-submit the stale form. (The app title "KopiaKt" is no
# anchor either - the WebView node carries it as document title on EVERY screen.)
- extendedWaitUntil:
    visible: "Browse and restore your Kopia backups"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Should successfully connect
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 60000
