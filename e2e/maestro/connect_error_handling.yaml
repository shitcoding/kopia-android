# E2E Test: Connection Error Handling
# Verifies proper error handling for invalid credentials and missing repos
# Expected: Show appropriate error messages without crashing
#
# UI is rendered in WebView (React app).
# NOTE: eraseText does not work reliably in WebView inputs. We navigate back
# and re-enter the Connect screen to get fresh empty fields between tests.

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- launchApp

# Navigate to connect screen
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 10000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

# ========================================
# Test 1: Empty path validation
# ========================================
# Try to connect without entering path
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"
- hideKeyboard
- tapOn:
    id: "connect-button"

# Should show validation error
- extendedWaitUntil:
    visible:
      text: ".*path.*required.*|.*Repository path.*"
    timeout: 5000

# ========================================
# Test 2: Empty password validation
# ========================================
# Enter path only, clear password
- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- eraseText: 100

- hideKeyboard
- tapOn:
    id: "connect-button"

# Should show password required error
- extendedWaitUntil:
    visible:
      text: ".*password.*required.*|.*Repository password.*"
    timeout: 5000

# ========================================
# Test 3: Wrong password
# ========================================
- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "wrongpassword"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Should show authentication error
- extendedWaitUntil:
    visible:
      text: ".*invalid.*|.*incorrect.*|.*failed.*|.*error.*|.*wrong.*"
    timeout: 15000

# ========================================
# Test 4: Non-existent path
# ========================================
# Navigate back to Welcome and re-enter Connect screen (fresh form)
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/nonexistent_repo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Should show path not found / directory error
- extendedWaitUntil:
    visible:
      text: ".*not found.*|.*does not exist.*|.*failed.*|.*error.*|.*directory.*|.*must be.*"
    timeout: 15000

# ========================================
# Test 5: Successful connection after errors
# ========================================
# Navigate back to Welcome and re-enter Connect screen (fresh form)
- back
- extendedWaitUntil:
    visible: "Connect to Repository"
    timeout: 5000
- tapOn: "Connect to Repository"
- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# Should successfully connect
- extendedWaitUntil:
    visible: "Snapshots"
    timeout: 15000
