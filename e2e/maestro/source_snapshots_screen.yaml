# E2E Test: SourceSnapshotsScreen UI
# Tests source header, snapshot cards, selection mode, delete dialog cancel path
# Repository: /sdcard/testrepo
# Password: test123
#
# This test exercises the non-destructive (cancel) path of snapshot deletion.
# No snapshots are actually deleted.
#
# UI is rendered in WebView (React app).

appId: org.kopiaKt.app
androidWebViewHierarchy: devtools
---
# Clear app state and start fresh
- stopApp
- stopApp: "com.google.android.documentsui"
- launchApp

# Connect to repository
- extendedWaitUntil:
    visible: "KopiaKt"
    timeout: 30000
- tapOn: "Connect to Repository"

- extendedWaitUntil:
    visible: "Connect Repository"
    timeout: 5000

- tapOn:
    id: "repo-path-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "/sdcard/testrepo"
- hideKeyboard

- tapOn:
    id: "repo-password-input"
- waitForAnimationToEnd
- eraseText: 1
- inputText: "test123"

- hideKeyboard
- tapOn:
    id: "connect-button"

# SnapshotsScreen: tap source card
- extendedWaitUntil:
    visible:
      text: ".*76 files.*"
    timeout: 60000
- tapOn:
    text: ".*76 files.*"

# SourceSnapshotsScreen: verify source header
- extendedWaitUntil:
    visible:
      text: ".* snapshots"
    timeout: 10000

# Assert "user@host · N snapshots" header format
- assertVisible:
    text: ".*@.*"
- assertVisible:
    text: ".* snapshots"

# Assert snapshot card is visible (date + stats)
- extendedWaitUntil:
    visible:
      text: ".*76.*files.*"
    timeout: 10000
- assertVisible:
    text: ".*76.*files.*"

# Enter selection mode by tapping the checkbox on the first snapshot card
- tapOn:
    text: "Select snapshot 1"

# Wait for selection toolbar (WebView DOM update can be slow)
# Text may be split across lines ("1" + "selected") in the toolbar
- extendedWaitUntil:
    visible:
      text: ".*selected.*"
    timeout: 15000

- assertVisible:
    text: ".*selected.*"

# Verify toolbar buttons
- assertVisible: "Select all"
- assertVisible: "Delete"

# Tap Select All
- tapOn: "Select all"

# Verify count updated (text may be multiline in toolbar)
- extendedWaitUntil:
    visible:
      text: ".*selected.*"
    timeout: 3000

# Tap Delete to open confirmation dialog
- tapOn: "Delete"

# Wait for delete confirmation dialog
- extendedWaitUntil:
    visible:
      text: ".*cannot be undone.*|.*permanently.*|Delete.*snapshot.*"
    timeout: 5000

# Verify dialog has Cancel and Delete buttons
- assertVisible: "Cancel"

# Tap Cancel to dismiss dialog (non-destructive path)
- tapOn: "Cancel"

# After cancel, still in selection mode. Dismiss selection by tapping X button.
- extendedWaitUntil:
    visible:
      text: ".*selected.*"
    timeout: 3000

# Tap X to exit selection mode
- tapOn: "Clear selection"

# Verify we're still on SourceSnapshotsScreen with snapshot list intact
- extendedWaitUntil:
    visible:
      text: ".*snapshots.*|.*76.*files.*"
    timeout: 5000

- assertVisible:
    text: ".*76.*files.*"
