# TLS terminator in front of the plain-HTTP WebDAV container, so the client exercises a real
# private-CA certificate (and our certificate-pinning path) against a real WebDAV server.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Backup blobs are up to ~20 MiB; never let nginx cap an upload.
    client_max_body_size 0;

    location / {
        # mod_dav rejects a MOVE whose Destination authority/scheme doesn't match the request it
        # sees. We terminate TLS here, so rewrite the Destination back to http:// and forward the
        # ORIGINAL authority (with port) as Host, keeping the two consistent for Apache.
        set $dav_destination $http_destination;
        if ($http_destination ~* "^https://(.*)$") {
            set $dav_destination "http://$1";
        }

        proxy_pass http://webdav;
        proxy_set_header Host $http_host;
        proxy_set_header Destination $dav_destination;
        proxy_set_header X-Forwarded-Proto https;

        # Streamed, unbuffered proxying — a backup client reads/writes whole blobs.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
